<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AuraWind — latest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .legend {
      background: white; padding: .5rem .75rem; border-radius: .5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.15); font: 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .leaflet-popup-content canvas { width: 320px !important; height: 160px !important; }
    .obs-arrow {
      width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.9);
      display: grid; place-items: center; border: 1px solid rgba(0,0,0,.2);
    }
    .obs-arrow svg { transform-origin: 50% 50%; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const BOUNDS = [[50.64, -1.42], [50.9, -0.95]];
const CENTER = [(BOUNDS[0][0]+BOUNDS[1][0])/2, (BOUNDS[0][1]+BOUNDS[1][1])/2];

const map = L.map('map', {
  center: CENTER, zoom: 11, minZoom: 9, maxBounds: BOUNDS
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

// --- Overlays ---
const flowOverlay = L.imageOverlay('solent_flow.png', BOUNDS, { opacity: 0.75 });

// conditionally add a wind-barbs PNG if it exists
async function addBarbsIfExists(layersControl) {
  try {
    const res = await fetch('solent_barbs.png', { method: 'HEAD' });
    if (res.ok) {
      const barbs = L.imageOverlay('solent_barbs.png', BOUNDS, { opacity: 0.9 });
      layersControl.addOverlay(barbs, 'Wind barbs (png)');
    }
  } catch (_) {}
}

const obsLayer = L.layerGroup().addTo(map); // default ON

function speedColor(kn) {
  if (kn == null) return '#666';
  if (kn < 8) return '#3CB371';
  if (kn < 15) return '#F3C623';
  if (kn < 22) return '#F78C1F';
  return '#E74C3C';
}

function arrowIcon(speedKn, dirDeg) {
  const color = speedColor(speedKn);
  const svg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="${color}" xmlns="http://www.w3.org/2000/svg" style="transform: rotate(${dirDeg ?? 0}deg);">
    <path d="M12 2l4 7h-3v7h-2V9H8l4-7z"/>
  </svg>`;
  return L.divIcon({
    html: `<div class="obs-arrow">${svg}</div>`,
    className: '', iconSize: [22,22], iconAnchor: [11,11]
  });
}

fetch('obs_recent.json').then(r => r.json()).then(data => {
  (data.stations || []).forEach(st => {
    if (st.lat == null || st.lon == null) return;
    const last = (st.series || []).filter(x => x.ts).slice(-1)[0] || {};
    const m = L.marker([st.lat, st.lon], { icon: arrowIcon(last.wspd_kn, last.wdir_degT) });
    m.bindPopup(() => {
      const id = 'c' + Math.random().toString(36).slice(2,8);
      const name = st.station_name || st.station_id;
      const t = last.ts || '';
      const wspd = last.wspd_kn == null ? '—' : last.wspd_kn.toFixed(1);
      const wdir = last.wdir_degT == null ? '—' : Math.round(last.wdir_degT);
      const div = document.createElement('div');
      div.innerHTML = `<b>${name}</b><br><small>${t}</small><br>
                       <small>Latest: ${wspd} kn @ ${wdir}°T</small><br>
                       <canvas id="${id}"></canvas>`;
      setTimeout(() => renderChart(id, st), 10);
      return div;
    });
    m.addTo(obsLayer);
  });
});

function renderChart(canvasId, st) {
  const now = new Date();
  const cutoff = new Date(now.getTime() - 3*3600*1000);
  const obs = (st.series || [])
    .map(x => ({ t: new Date(x.ts), v: x.wspd_kn }))
    .filter(x => x.t >= cutoff && x.v != null);

  const url = new URL('https://api.open-meteo.com/v1/forecast');
  url.searchParams.set('latitude', st.lat);
  url.searchParams.set('longitude', st.lon);
  url.searchParams.set('hourly', 'wind_speed_10m,wind_direction_10m');
  url.searchParams.set('past_days', '1');
  url.searchParams.set('timezone', 'UTC');

  fetch(url).then(r => r.json()).then(j => {
    const times = (j.hourly && j.hourly.time) || [];
    const spd = (j.hourly && j.hourly.wind_speed_10m) || [];
    const om = times.map((t, i) => ({ t: new Date(t), v: spd[i]*1.94384449 }))
                    .filter(p => p.t >= cutoff);

    const labels = [];
    const obsY = [];
    const omY  = [];

    const allT = Array.from(new Set([...obs.map(x=>x.t.toISOString()), ...om.map(x=>x.t.toISOString())]))
                      .map(s => new Date(s))
                      .sort((a,b)=>a-b);
    allT.forEach(t => {
      labels.push(t.toISOString().slice(11,16));
      const o = obs.find(x => Math.abs(x.t - t) < 45*60*1000);
      const m = om.find(x => Math.abs(x.t - t) < 45*60*1000);
      obsY.push(o ? o.v : null);
      omY.push(m ? m.v : null);
    });

    const ctx = document.getElementById(canvasId).getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Obs (kn)', data: obsY, spanGaps:true },
          { label: 'Open-Meteo 10m (kn)', data: omY, spanGaps:true }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: true } },
        scales: { y: { beginAtZero: true, suggestedMax: 30 } }
      }
    });
  }).catch(() => {});
}

// Controls
const overlays = { "Observations (arrows)": obsLayer, "Flow heatmap": flowOverlay };
const ctl = L.control.layers(null, overlays, { collapsed: false }).addTo(map);
addBarbsIfExists(ctl);

const legend = L.control({position:'bottomright'});
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<b>Wind speed (kn)</b><br>' +
    '<span style="color:#3CB371">●</span> &lt;8 &nbsp; ' +
    '<span style="color:#F3C623">●</span> 8–15 &nbsp; ' +
    '<span style="color:#F78C1F">●</span> 15–22 &nbsp; ' +
    '<span style="color:#E74C3C">●</span> &gt;22';
  return div;
};
legend.addTo(map);
</script>
</body></html>
