<!-- /index.html -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>AuraWind — Solent Live Observations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js + time adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

    <style>
        :root {
            --bg: #0b1120;
            --text: #0b0f1a;
            --muted: rgba(0, 0, 0, 0.62);
            --accent: #14b8a6;

            --hud-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
            --hud-border: rgba(0, 0, 0, 0.12);
            --hud-bg: rgba(255, 255, 255, 0.88);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        }

        /* Fullscreen map */
        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .leaflet-container {
            background: var(--bg);
        }

        /* Overlay HUD (no header bar) */
        .hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
        }

        .hud-left {
            position: absolute;
            left: 12px;
            top: 2px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            pointer-events: none;
        }

        /* Logo */
        #logo {
            height: clamp(120px, 10vw, 160px);
            width: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.18));
        }

        .hud-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: var(--text);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .hud-title .h1 {
            font-size: clamp(22px, 2.1vw, 32px);
            font-weight: 950;
            letter-spacing: 0.2px;
            line-height: 1.05;
        }

        .hud-title .sub {
            font-size: clamp(14px, 1.25vw, 18px);
            font-weight: 750;
            color: var(--muted);
            line-height: 1.05;
        }

        /* Status as plain text */
        .status-text {
            margin-left: 16px;
            font-size: clamp(16px, 1.4vw, 22px);
            font-weight: 900;
            color: var(--text);
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.75);
            white-space: nowrap;
        }

        /* Refresh */
        #refreshBtn {
            position: absolute;
            top: 12px;
            right: 12px;
            pointer-events: auto;
            background: var(--accent);
            color: #062b2a;
            border: 0;
            border-radius: 12px;
            padding: 0.58rem 0.95rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(20, 184, 166, 0.18);
            transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
        }

        /* Forecast button (left of Refresh) */
        #forecastBtn {
            position: absolute;
            top: 12px;
            right: 118px;
            pointer-events: auto;
            background: rgba(6, 27, 40, 0.75);
            color: #eaf3fb;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 12px;
            padding: 0.58rem 0.95rem;
            font-weight: 800;
            letter-spacing: 0.2px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            text-decoration: none;
        }

        #forecastBtn:hover {
            background: rgba(6, 27, 40, 0.90);
        }

        /* Flow button (left of Forecast) */
        #flowBtn {
            position: absolute;
            top: 12px;
            right: 208px;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.75);
            color: #0b0f1a;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 12px;
            padding: 0.58rem 0.95rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.10);
            transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
        }

        #flowBtn.active {
            background: rgba(20, 184, 166, 0.30);
            border-color: rgba(20, 184, 166, 0.45);
        }

        #refreshBtn:hover,
        #flowBtn:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        #refreshBtn:disabled {
            opacity: 0.6;
            cursor: default;
            transform: none;
        }

        /* Legend */
        .legend {
            position: absolute;
            right: 12px;
            bottom: 12px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--hud-border);
            border-radius: 14px;
            padding: 10px 12px;
            box-shadow: var(--hud-shadow);
            font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color: var(--text);
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .legend h3 {
            margin: 0 0 6px 0;
            font-size: 12px;
            font-weight: 950;
            color: var(--text);
        }

        .legend .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
            color: rgba(0, 0, 0, 0.75);
        }

        .chip {
            width: 18px;
            height: 10px;
            border-radius: 3px;
            border: 1px solid rgba(0, 0, 0, 0.25);
        }

        /* Leaflet popup: compact */
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
        }

        .leaflet-popup-content {
            margin: 10px 12px;
        }

        /* Timeseries popup content */
        .ts-root {
            width: 400px;
        }

        .ts-root canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Mobile overrides */
        @media (max-width: 768px) {
            .ts-root {
                width: 260px;
            }

            .legend {
                transform: scale(0.92);
                transform-origin: bottom right;
            }

            #logo {
                height: 92px;
            }

            .hud-left {
                top: 6px;
            }

            #refreshBtn,
            #forecastBtn,
            #flowBtn {
                padding: 0.5rem 0.75rem;
                border-radius: 12px;
            }

            #flowBtn {
                right: 180px;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Overlay HUD -->
    <div class="hud">
        <div class="hud-left">
            <img id="logo" src="aura-logo.png" alt="Aura" />
            <div class="hud-title">
                <div class="h1">Solent Live Observations</div>
                <div class="sub">Wind • Gust • Direction • MSLP • Rain</div>
            </div>
            <div id="status" class="status-text">Loading…</div>
        </div>

        <button id="flowBtn" title="Toggle wind flow overlay">Flow</button>
        <a id="forecastBtn" href="./forecast.html" title="Free forecast dashboard">Forecast</a>
        <button id="refreshBtn" title="Refresh now">Refresh</button>

        <div class="legend" id="legend">
            <h3>Wind speed (kt)</h3>
            <div class="row"><span class="chip" style="background:#00008b"></span> 0–3</div>
            <div class="row"><span class="chip" style="background:#4169e1"></span> 3–5</div>
            <div class="row"><span class="chip" style="background:#00ffcc"></span> 5–10</div>
            <div class="row"><span class="chip" style="background:#00ff00"></span> 10–20</div>
            <div class="row"><span class="chip" style="background:#00cc00"></span> 20–22</div>
            <div class="row"><span class="chip" style="background:#ff9900"></span> 22–30</div>
            <div class="row"><span class="chip" style="background:#ff0000"></span> 30–33</div>
            <div class="row"><span class="chip" style="background:#b22222"></span> 33–40</div>
            <div class="row"><span class="chip" style="background:#8b008b"></span> 40–60</div>
            <div class="row"><span class="chip" style="background:#800080"></span> 60+</div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById("status");
        const setStatus = (s) => { if (statusEl) statusEl.textContent = s; };

        window.addEventListener("error", (e) => {
            console.error("Global error:", e.error || e.message);
            setStatus("Script error");
        });

        window.addEventListener("unhandledrejection", (e) => {
            console.error("Unhandled promise:", e.reason);
            setStatus("Load failed");
        });

        /* ---------------- Config ---------------- */
        const OBS_URL = "./solent_obs.json";
        const AUTO_REFRESH_MS = 10 * 60 * 1000;

        const BREAKS = [0, 3, 5, 10, 20, 22, 30, 33, 40, 60];
        const COLORS = ["#00008b", "#4169e1", "#00ffcc", "#00ff00", "#00cc00", "#ff9900", "#ff0000", "#b22222", "#8b008b", "#800080"];

        /* ---------------- Responsive sizing ---------------- */
        function isMobile() { return window.matchMedia("(max-width: 768px)").matches; }
        function uiScale() { return isMobile() ? 0.62 : 1.0; }
        function arrowSizePx() { return Math.round(96 * uiScale()); }
        function arrowFontPx() { return Math.round(20 * uiScale()); }

        const lerp = (a, b, t) => a + (b - a) * t;

        function mixHex(a, b, t) {
            const pa = parseInt(a.slice(1), 16);
            const pb = parseInt(b.slice(1), 16);
            const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
            const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
            const r = Math.round(lerp(ar, br, t));
            const g = Math.round(lerp(ag, bg, t));
            const b2 = Math.round(lerp(ab, bb, t));
            return `#${((r << 16) | (g << 8) | b2).toString(16).padStart(6, "0")}`;
        }

        function colorForSpeed(spd) {
            if (spd == null || Number.isNaN(spd)) return "#999";
            for (let i = 0; i < BREAKS.length - 1; i++) {
                const lo = BREAKS[i], hi = BREAKS[i + 1];
                if (spd <= hi) {
                    const t = Math.max(0, Math.min(1, (spd - lo) / Math.max(1e-9, hi - lo)));
                    return mixHex(COLORS[i], COLORS[i + 1], t);
                }
            }
            return COLORS.at(-1);
        }

        // Meteorological: direction is FROM; arrow points TO -> add 180
        const rotateFromDirDeg = (d) => (Number(d) + 180) % 360;

        function svgStationArrow(color, size) {
            const stroke = Math.max(4, size / 12).toFixed(1);
            return `
        <svg width="${size}" height="${size}" viewBox="0 0 64 64"
          xmlns="http://www.w3.org/2000/svg"
          style="filter:drop-shadow(0 0 3px rgba(0,0,0,.35));">
          <g transform="translate(32,32)">
            <line x1="0" y1="20" x2="0" y2="-16"
              stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"/>
            <polygon points="0,-26 -10,-8 10,-8" fill="${color}"/>
          </g>
        </svg>
      `;
        }

        /* ===============================
           Wind Flow Overlay (Particles)
           - Safe init: stores lat/lon and rebuilds pixel points after map has a view
           =============================== */

        function windUVFromMetDir(speedKt, dirFromDeg) {
            if (!Number.isFinite(speedKt) || !Number.isFinite(dirFromDeg)) return { u: 0, v: 0 };
            const rad = dirFromDeg * Math.PI / 180;
            const u = -speedKt * Math.sin(rad); // +u east
            const v = -speedKt * Math.cos(rad); // +v north
            return { u, v };
        }

        function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

        class WindFlowOverlay {
            constructor(map) {
                this.map = map;
                this.canvas = document.createElement("canvas");
                this.canvas.style.position = "absolute";
                this.canvas.style.top = "0";
                this.canvas.style.left = "0";
                this.canvas.style.pointerEvents = "none";
                this.canvas.style.zIndex = "600"; // above tiles, below HUD
                this.ctx = this.canvas.getContext("2d", { alpha: true });

                // state
                this.enabled = false;
                this.particles = [];
                this.raw = [];    // stations: lat/lon + u/v
                this.points = []; // stations: pixel x/y + u/v
                this.lastT = 0;
                this.raf = null;

                // tunables
                this.power = 2.0;          // IDW power
                this.radiusPx = 220;       // influence radius in pixels
                this.fade = 0.10;          // trail fade per frame (0..1)
                this.particleCount = 900;  // desktop default
                this.speedScale = 0.9;     // motion speed multiplier
                this.lineWidth = 1.2;      // particle stroke
                this.alpha = 0.65;         // stroke alpha

                if (isMobile()) {
                    this.particleCount = 520;
                    this.radiusPx = 180;
                    this.lineWidth = 1.0;
                    this.alpha = 0.55;
                    this.speedScale = 0.85;
                }

                map.getPanes().overlayPane.appendChild(this.canvas);

                // keep canvas in sync
                this._resize = () => this.resize();
                map.on("resize", this._resize);

                // rebuild pixel points whenever view changes (now safe)
                this._rebuild = () => this.rebuildPointsSafely();
                map.on("moveend", this._rebuild);
                map.on("zoomend", this._rebuild);

                // clear trails while panning/zooming
                this._clearOnMove = () => this.redrawNow();
                map.on("move", this._clearOnMove);
                map.on("zoom", this._clearOnMove);
                map.on("zoomanim", this._clearOnMove);

                this.resize();
            }

            resize() {
                const size = this.map.getSize();
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = Math.round(size.x * dpr);
                this.canvas.height = Math.round(size.y * dpr);
                this.canvas.style.width = `${size.x}px`;
                this.canvas.style.height = `${size.y}px`;
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            setStations(obsRows) {
                // Store as lat/lon first (safe before map has center/zoom)
                this.raw = (obsRows || [])
                    .filter(r => r.lat != null && r.lon != null && r.wspd_kn != null && r.wdir_degT != null)
                    .map(r => {
                        const uv = windUVFromMetDir(Number(r.wspd_kn), Number(r.wdir_degT));
                        return { lat: Number(r.lat), lon: Number(r.lon), u: uv.u, v: uv.v, spd: Number(r.wspd_kn) };
                    });

                // Try rebuild now; if map isn't ready, it will rebuild on moveend/zoomend
                this.rebuildPointsSafely();
                this.seedParticles(true);
            }

            rebuildPointsSafely() {
                // If map has no view yet, this can throw. Just skip and wait for moveend.
                try {
                    const c = this.map.getCenter();
                    if (!c) return;
                } catch {
                    return;
                }

                const raw = this.raw || [];
                this.points = raw.map(r => {
                    const p = this.map.latLngToContainerPoint([r.lat, r.lon]);
                    return { x: p.x, y: p.y, u: r.u, v: r.v, spd: r.spd };
                });
            }

            seedParticles(force = false) {
                if (!this.enabled && !force) return;
                const size = this.map.getSize();
                const W = size.x, H = size.y;
                const n = this.particleCount;

                this.particles = new Array(n).fill(0).map(() => ({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    age: Math.random() * 120,
                }));
            }

            enable() {
                if (this.enabled) return;
                this.enabled = true;
                this.rebuildPointsSafely();
                this.seedParticles(true);
                this.lastT = performance.now();
                this.loop();
            }

            disable() {
                this.enabled = false;
                if (this.raf) cancelAnimationFrame(this.raf);
                this.raf = null;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            toggle() {
                if (this.enabled) this.disable();
                else this.enable();
            }

            redrawNow() {
                if (!this.enabled) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            fieldAt(x, y) {
                const pts = this.points;
                if (!pts.length) return { u: 0, v: 0, w: 0 };

                let su = 0, sv = 0, sw = 0;
                const r2 = this.radiusPx * this.radiusPx;
                const pwr = this.power;

                for (let i = 0; i < pts.length; i++) {
                    const dx = x - pts[i].x;
                    const dy = y - pts[i].y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 > r2) continue;
                    const w = 1 / Math.pow(Math.max(6, Math.sqrt(d2)), pwr); // avoid singularity
                    su += pts[i].u * w;
                    sv += pts[i].v * w;
                    sw += w;
                }

                if (sw <= 0) return { u: 0, v: 0, w: 0 };
                return { u: su / sw, v: sv / sw, w: sw };
            }

            loop() {
                if (!this.enabled) return;

                const t = performance.now();
                const dt = clamp((t - this.lastT) / 16.67, 0.5, 2.2);
                this.lastT = t;

                const size = this.map.getSize();
                const W = size.x, H = size.y;

                // fade trails
                this.ctx.fillStyle = `rgba(255,255,255,${this.fade})`;
                this.ctx.globalCompositeOperation = "destination-out";
                this.ctx.fillRect(0, 0, W, H);
                this.ctx.globalCompositeOperation = "source-over";

                this.ctx.lineWidth = this.lineWidth;
                this.ctx.strokeStyle = `rgba(16,185,129,${this.alpha})`;

                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];

                    if (p.age > 140 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
                        p.x = Math.random() * W;
                        p.y = Math.random() * H;
                        p.age = 0;
                        continue;
                    }

                    const f = this.fieldAt(p.x, p.y);
                    if (f.w === 0) {
                        p.x += (Math.random() - 0.5) * 0.6;
                        p.y += (Math.random() - 0.5) * 0.6;
                        p.age += 1;
                        continue;
                    }

                    const pxPerFrame = 0.55 * this.speedScale * dt;
                    const nx = p.x + f.u * pxPerFrame;
                    const ny = p.y - f.v * pxPerFrame; // v north is up; canvas y is down

                    this.ctx.beginPath();
                    this.ctx.moveTo(p.x, p.y);
                    this.ctx.lineTo(nx, ny);
                    this.ctx.stroke();

                    p.x = nx;
                    p.y = ny;
                    p.age += 1;
                }

                this.raf = requestAnimationFrame(() => this.loop());
            }
        }

        /* ---------------- Map ---------------- */
        const map = L.map("map", { zoomControl: true });
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
            attribution: "&copy; OpenStreetMap, &copy; CARTO",
        }).addTo(map);

        const layerStations = L.layerGroup().addTo(map);

        // Flow overlay
        const flow = new WindFlowOverlay(map);
        const flowBtn = document.getElementById("flowBtn");
        flowBtn.addEventListener("click", () => {
            flow.toggle();
            flowBtn.classList.toggle("active", flow.enabled);
        });

        // Refresh
        const refreshBtn = document.getElementById("refreshBtn");
        refreshBtn.addEventListener("click", () => loadObs(true));

        function clearStations() { layerStations.clearLayers(); }

        function addStationMarker(st) {
            if (st.lat == null || st.lon == null || st.wspd_kn == null || st.wdir_degT == null) return;

            const color = colorForSpeed(st.wspd_kn);
            const rotate = rotateFromDirDeg(st.wdir_degT);

            const A = arrowSizePx();
            const F = arrowFontPx();

            const arrow = svgStationArrow(color, A);

            const html = `
        <div style="transform:rotate(${rotate}deg);opacity:${isMobile() ? 0.9 : 1}">${arrow}</div>
        <div style="
          position:relative;
          top:-${A / 2 - 2}px;
          width:${A}px;
          text-align:center;
          font:900 ${F}px/1 system-ui;
          color:#111;
          text-shadow:0 0 2px #fff,0 0 8px rgba(255,255,255,.95);
        ">${Math.round(st.wspd_kn)}</div>
      `;

            const icon = L.divIcon({
                html,
                iconSize: [A, A],
                iconAnchor: [A / 2, A / 2],
                className: "",
            });

            const m = L.marker([st.lat, st.lon], { icon }).addTo(layerStations);

            const gustText = st.gust_kn == null ? "" : ` gust ${Math.round(st.gust_kn)}`;
            const label = `${st.station_name || st.station_id}<br>${Math.round(st.wspd_kn)} kt${gustText}`;
            m.bindTooltip(label);

            m.on("click", (e) => {
                L.DomEvent.stop(e);

                const mount = document.createElement("div");
                mount.style.width = isMobile() ? "260px" : "420px";

                const popup = L.popup({
                    maxWidth: isMobile() ? 280 : 560,
                    autoClose: true,
                    closeOnClick: true,
                    closeButton: false,
                    offset: [0, -12],
                })
                    .setLatLng([st.lat, st.lon])
                    .setContent(mount)
                    .openOn(map);

                if (window.attachTimeseriesTo) {
                    window.attachTimeseriesTo(mount, st.station_id, 24, popup);
                }
            });
        }

        function fitToDataBounds(points) {
            if (!points.length) return;

            let latMin = 90, latMax = -90, lonMin = 180, lonMax = -180;
            for (const p of points) {
                if (p.lat != null && p.lon != null) {
                    latMin = Math.min(latMin, p.lat);
                    latMax = Math.max(latMax, p.lat);
                    lonMin = Math.min(lonMin, p.lon);
                    lonMax = Math.max(lonMax, p.lon);
                }
            }

            map.fitBounds(
                [[latMin - 0.06, lonMin - 0.1], [latMax + 0.06, lonMax + 0.1]],
                { padding: [20, 20] }
            );
        }

        let autoTimer = null;

        async function loadObs(fromButton = false) {
            try {
                refreshBtn.disabled = true;
                setStatus(fromButton ? "Refreshing…" : "Loading…");

                const res = await fetch(`${OBS_URL}?ts=${Date.now()}`, { cache: "no-store" });
                if (!res.ok) {
                    setStatus(`Fetch ${res.status}`);
                    throw new Error(`HTTP ${res.status}`);
                }

                let data;
                try {
                    data = await res.json();
                } catch (e) {
                    const txt = await res.text();
                    console.error("JSON parse failed:", txt.slice(0, 200));
                    setStatus("Invalid JSON");
                    throw e;
                }

                const rows = Array.isArray(data?.obs) ? data.obs : Array.isArray(data) ? data : [];
                const obs = rows.map((r) => ({
                    lat: r.lat ?? r.latitude ?? r.Latitude,
                    lon: r.lon ?? r.longitude ?? r.Longitude,
                    wspd_kn: r.wspd_kn ?? r.wind_speed_kt ?? r.wspd ?? r.wind_knots ?? r.wind_speed,
                    gust_kn: r.gust_kn ?? r.wind_gust_kt ?? r.wind_gust ?? r.gust ?? null,
                    wdir_degT: r.wdir_degT ?? r.wind_dir_deg ?? r.wdir ?? r.direction ?? r.wind_direction,
                    pressure_hpa: r.pressure ?? r.mslp ?? r.mslp_hpa ?? null,
                    precip_mm: r.precip_mm ?? r.precipitation ?? null,
                    station_name: r.station_name ?? r.name ?? r.Site ?? r.station_id ?? r.site_id ?? r.id,
                    station_id: r.station_id ?? r.site_id ?? r.id,
                }));

                const ok = obs.filter((r) => r.lat != null && r.lon != null && r.wspd_kn != null && r.wdir_degT != null);

                // Ensure map has a view before flow tries to convert lat/lon -> pixels
                if (ok.length) {
                    if (!map._fitDone || fromButton) {
                        fitToDataBounds(ok);
                        map._fitDone = true;
                    }
                }

                clearStations();
                for (const r of ok) addStationMarker(r);

                // Update flow field (safe now, and also rebuilds on moveend/zoomend)
                flow.setStations(ok);

                if (ok.length) {
                    const gen = data?.meta?.generated_at || new Date().toISOString();
                    const genStr = (() => {
                        try { return new Date(gen).toLocaleString(undefined, { hour12: false }); }
                        catch { return String(gen); }
                    })();
                    setStatus(`Stations: ${ok.length} • Updated: ${genStr}`);
                } else {
                    setStatus("No stations in data");
                    console.warn("Sample rows:", rows.slice(0, 3));
                }
            } catch (e) {
                console.error(e);
                setStatus("Load failed");
            } finally {
                refreshBtn.disabled = false;
                if (autoTimer) clearTimeout(autoTimer);
                autoTimer = setTimeout(loadObs, AUTO_REFRESH_MS);
            }
        }

        document.addEventListener("DOMContentLoaded", () => loadObs(false));
        map.whenReady(() => { if (!map._fitDone) loadObs(false); });

        // Optional: if orientation/viewport changes, re-render
        window.addEventListener("resize", () => {
            if (map._fitDone) loadObs(true);
        });
    </script>

    <!-- Time-series + Forecast overlay + Source toggle -->
    <script>
        const stationIdCache = new Map();
        const seriesCache = new Map();
        const STATION_CACHE_MS = 24 * 3600 * 1000;
        const SERIES_CACHE_MS = 2 * 60 * 1000;

        const now = () => Date.now();
        const UUID_RE =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

        function windowISO(hours, ref = new Date()) {
            const end = new Date(ref);
            const start = new Date(end.getTime() - hours * 3600 * 1000);
            return { startISO: start.toISOString(), endISO: end.toISOString() };
        }

        async function getStationId(idOrCode) {
            if (idOrCode == null) return null;

            const raw = String(idOrCode);
            const key = raw.trim();
            if (!key) return null;
            if (UUID_RE.test(key)) return key;

            const cached = stationIdCache.get(key);
            if (cached && now() - cached.ts < STATION_CACHE_MS) return cached.id;

            let q = sb.from("stations").select("id").eq("code", key).limit(1).maybeSingle();
            let { data, error } = await q;

            if (!data?.id && !error) {
                ({ data, error } = await sb.from("stations").select("id").eq("name", key).limit(1).maybeSingle());
            }

            if (!data?.id && !error) {
                ({ data, error } = await sb.from("stations").select("id").ilike("code", key).limit(1).maybeSingle());
            }

            if (error) {
                console.error("[stations lookup]", { key, error });
                return null;
            }

            const id = data?.id || null;
            stationIdCache.set(key, { id, ts: now() });
            return id;
        }

        function normalizeRow(r) {
            const tsRaw = r.observed_at || r.ts || r.time || r.datetime;
            const ts = tsRaw ? new Date(tsRaw).toISOString() : null;

            const wspd = r.wind_speed ?? r.wind_speed_kt ?? r.wspd ?? r.wspd_kn ?? null;
            const gust = r.wind_gust ?? r.wind_gust_kt ?? r.gust ?? r.gust_kn ?? null;
            const wdir = r.wind_direction ?? r.wind_dir_deg ?? r.wdir ?? r.dir ?? null;
            const mslp = r.pressure ?? r.mslp_hpa ?? r.mslp ?? null;
            const rain = r.precip_mm ?? r.precipitation ?? null;
            return { ts, wspd, gust, wdir, mslp, rain };
        }

        async function fetchObsSeriesByCode(idOrCode, hours, signal) {
            const cacheKey = `${idOrCode}|${hours}`;
            const cached = seriesCache.get(cacheKey);
            if (cached && now() - cached.ts < SERIES_CACHE_MS) return cached.data;

            const stationId = await getStationId(idOrCode);
            if (!stationId) return [];

            const { startISO, endISO } = windowISO(hours);

            let query = sb
                .from("observations")
                .select("*")
                .eq("station_id", stationId)
                .gte("observed_at", startISO)
                .lte("observed_at", endISO)
                .order("observed_at", { ascending: true });

            if (typeof query.abortSignal === "function" && signal) query = query.abortSignal(signal;

            const { data, error } = await query;

            if (signal?.aborted) return [];
            if (error) {
                console.error("[observations select]", error);
                return [];
            }

            const rows = (data || []).map(normalizeRow).filter((r) => r.ts);
            seriesCache.set(cacheKey, { data: rows, ts: now() });
            return rows;
        }

        async function fetchForecastLatestSeries(idOrCodeOrId, hoursBack = 24, hoursFwd = 48, signal) {
            const stationId = await getStationId(idOrCodeOrId);
            if (!stationId) return [];

            const nowMs = Date.now();
            const startISO = new Date(nowMs - hoursBack * 3600 * 1000).toISOString();
            const endISO = new Date(nowMs + hoursFwd * 3600 * 1000).toISOString();

            let q = sb
                .from("forecast_hourly_latest")
                .select("*")
                .eq("station_id", stationId)
                .gte("valid_time", startISO)
                .lte("valid_time", endISO)
                .order("valid_time", { ascending: true });

            if (typeof q.abortSignal === "function" && signal) q = q.abortSignal(signal);

            const { data, error } = await q;

            if (signal?.aborted) return [];
            if (error) {
                console.error("[forecast_latest select]", error);
                return [];
            }
            return data || [];
        }

        function align(labels, xs, ys) {
            const m = new Map(xs.map((x, i) => [x, ys[i]]));
            return labels.map((t) => (m.has(t) ? m.get(t) : null));
        }

        async function attachTimeseriesTo(containerEl, stationCodeOrId, defaultHours = 6, leafletPopup = null) {
            if (containerEl.dataset.bound === "1") return;
            containerEl.dataset.bound = "1";

            containerEl.__tsState = {
                req: 0,
                abort: null,
                speedChart: null,
                dirChart: null,
                mslpRainChart: null,
                mode: "wind",
            };

            containerEl.innerHTML = `
        <div class="ts-root">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
            <span style="font-size:12px;opacity:.7;">Window:</span>
            <select class="ts-window" style="font-size:12px;padding:2px 6px;border-radius:10px;">
              <option value="3">3h</option>
              <option value="6" selected>6h</option>
              <option value="12">12h</option>
              <option value="24">24h</option>
            </select>

            <span style="font-size:12px;opacity:.7;margin-left:10px;">Source:</span>
            <select class="ts-source" style="font-size:12px;padding:2px 6px;border-radius:10px;">
              <option value="wind" selected>Wind</option>
              <option value="mslp">MSLP/Rain</option>
            </select>
          </div>

          <div class="panel-wind">
            <div style="width:100%;height:180px;position:relative;margin-bottom:10px;">
              <canvas class="ts-canvas-speed"></canvas>
            </div>
            <div style="width:100%;height:140px;position:relative;">
              <canvas class="ts-canvas-dir"></canvas>
            </div>
          </div>

          <div class="panel-mslp" style="display:none;">
            <div style="width:100%;height:200px;position:relative;">
              <canvas class="ts-canvas-mslp"></canvas>
            </div>
          </div>

          <div class="ts-status" style="font-size:12px;opacity:.75;margin-top:6px;"></div>
        </div>
      `;

            const selWindow = containerEl.querySelector(".ts-window");
            const selSource = containerEl.querySelector(".ts-source");
            const panelWind = containerEl.querySelector(".panel-wind");
            const panelMSLP = containerEl.querySelector(".panel-mslp");

            const speedCtx = containerEl.querySelector(".ts-canvas-speed").getContext("2d");
            const dirCtx = containerEl.querySelector(".ts-canvas-dir").getContext("2d");
            const mslpCtx = containerEl.querySelector(".ts-canvas-mslp").getContext("2d");

            const statusEl = containerEl.querySelector(".ts-status");
            const setDisabled = (d) => { selWindow.disabled = d; selSource.disabled = d; };

            function showMode(mode) {
                containerEl.__tsState.mode = mode;
                panelWind.style.display = mode === "wind" ? "" : "none";
                panelMSLP.style.display = mode === "mslp" ? "" : "none";
            }

            function upsertWindCharts(labels, ts_obs, wspd, gust, wdir, ts_fcst, wspd_fc, gust_fc, wdir_fc) {
                const speedData = {
                    labels,
                    datasets: [
                        { label: "Wind (kt)", data: align(labels, ts_obs, wspd), borderWidth: 2, pointRadius: 0, tension: 0.25, spanGaps: true },
                        { label: "Gust (kt)", data: align(labels, ts_obs, gust), borderWidth: 1, borderDash: [4, 3], pointRadius: 0, tension: 0.25, spanGaps: true },
                        { label: "Fcst Wind (kt)", data: align(labels, ts_fcst, wspd_fc), borderWidth: 2, pointRadius: 0, tension: 0.25, spanGaps: true, borderDash: [6, 4] },
                        { label: "Fcst Gust (kt)", data: align(labels, ts_fcst, gust_fc), borderWidth: 1, pointRadius: 0, tension: 0.25, spanGaps: true, borderDash: [2, 2] },
                    ],
                };

                const nonNullSpeed = speedData.datasets.flatMap((d) => d.data || []).filter((v) => v != null);
                const maxSpeed = Math.max(10, ...(nonNullSpeed.length ? nonNullSpeed : [0]));

                const speedOpts = {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { type: "time" }, y: { suggestedMax: maxSpeed, title: { text: "kt", display: true } } },
                    plugins: { legend: { position: "bottom" } },
                    animation: { duration: 120 },
                };

                const dirData = {
                    labels,
                    datasets: [
                        { label: "Direction (°)", data: align(labels, ts_obs, wdir), borderWidth: 1, pointRadius: 0, tension: 0.25, spanGaps: true },
                        { label: "Fcst Dir (°)", data: align(labels, ts_fcst, wdir_fc), borderWidth: 1, pointRadius: 0, tension: 0.25, spanGaps: true, borderDash: [6, 4] },
                    ],
                };

                const dirOpts = {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { type: "time" }, y: { min: 0, max: 360, ticks: { stepSize: 90 }, title: { text: "°", display: true } } },
                    plugins: { legend: { display: false } },
                    animation: { duration: 120 },
                };

                if (!containerEl.__tsState.speedChart) containerEl.__tsState.speedChart = new Chart(speedCtx, { type: "line", data: speedData, options: speedOpts });
                else { const c = containerEl.__tsState.speedChart; c.data = speedData; c.options = speedOpts; c.update(); }

                if (!containerEl.__tsState.dirChart) containerEl.__tsState.dirChart = new Chart(dirCtx, { type: "line", data: dirData, options: dirOpts });
                else { const c2 = containerEl.__tsState.dirChart; c2.data = dirData; c2.options = dirOpts; c2.update(); }
            }

            function upsertMSLPChart(labels, ts_obs, mslp_obs, rain_obs, ts_fcst, mslp_fc, rain_fc) {
                const data = {
                    labels,
                    datasets: [
                        { label: "MSLP (hPa)", data: align(labels, ts_obs, mslp_obs), type: "line", borderWidth: 2, pointRadius: 0, tension: 0.25, spanGaps: true },
                        { label: "Fcst MSLP (hPa)", data: align(labels, ts_fcst, mslp_fc), type: "line", borderWidth: 2, pointRadius: 0, tension: 0.25, spanGaps: true, borderDash: [6, 4] },
                        { label: "Rain (mm)", data: align(labels, ts_obs, rain_obs), type: "bar", yAxisID: "y1" },
                        { label: "Fcst Rain (mm)", data: align(labels, ts_fcst, rain_fc), type: "bar", yAxisID: "y1" },
                    ],
                };

                const nonNullMSLP = data.datasets[0].data.concat(data.datasets[1].data).filter((v) => v != null);
                const yLeftMax = Math.max(1010, ...(nonNullMSLP.length ? nonNullMSLP : [1010]));

                const opts = {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { type: "time" },
                        y: { position: "left", suggestedMin: yLeftMax - 20, suggestedMax: yLeftMax + 20, title: { text: "hPa", display: true } },
                        y1: { position: "right", grid: { drawOnChartArea: false }, title: { text: "mm", display: true } },
                    },
                    plugins: { legend: { position: "bottom" } },
                    animation: { duration: 120 },
                };

                if (!containerEl.__tsState.mslpRainChart) containerEl.__tsState.mslpRainChart = new Chart(mslpCtx, { data, options: opts });
                else { const c = containerEl.__tsState.mslpRainChart; c.data = data; c.options = opts; c.update(); }
            }

            async function load(hours) {
                const state = containerEl.__tsState;
                const seq = ++state.req;

                if (state.abort) { try { state.abort.abort(); } catch { } }
                state.abort = new AbortController();

                setDisabled(true);
                statusEl.textContent = "Loading…";

                const obsRows = await fetchObsSeriesByCode(stationCodeOrId, hours, state.abort.signal);
                if (seq !== state.req) return;

                if (!obsRows.length) {
                    statusEl.textContent = "No data";
                    state.speedChart?.destroy(); state.speedChart = null;
                    state.dirChart?.destroy(); state.dirChart = null;
                    state.mslpRainChart?.destroy(); state.mslpRainChart = null;
                    setDisabled(false);
                    return;
                }

                const ts = obsRows.map((r) => (r.ts ? new Date(r.ts).toISOString() : null)).filter(Boolean);
                const wspd = obsRows.map((r) => r.wspd);
                const gust = obsRows.map((r) => r.gust);
                const wdir = obsRows.map((r) => r.wdir);
                const mslp = obsRows.map((r) => r.mslp);
                const rain = obsRows.map((r) => r.rain);

                const stationUuid = await getStationId(stationCodeOrId);
                const fcRows = stationUuid ? await fetchForecastLatestSeries(stationUuid, hours, 48, state.abort.signal) : [];

                const f_ts = fcRows.map((r) => (r.valid_time ? new Date(r.valid_time).toISOString() : null)).filter(Boolean);
                const f_wspd = fcRows.map((r) => r.wind_speed_kt);
                const f_gust = fcRows.map((r) => r.wind_gust_kt);
                const f_wdir = fcRows.map((r) => r.wind_dir_deg);
                const f_mslp = fcRows.map((r) => r.mslp_hpa);
                const f_rain = fcRows.map((r) => r.precip_mm);

                const labels = Array.from(new Set([...ts, ...f_ts])).sort();

                if (state.mode === "wind") upsertWindCharts(labels, ts, wspd, gust, wdir, f_ts, f_wspd, f_gust, f_wdir);
                else upsertMSLPChart(labels, ts, mslp, rain, f_ts, f_mslp, f_rain);

                if (leafletPopup?.update) {
                    leafletPopup.update();
                    setTimeout(() => {
                        leafletPopup.update();
                        state.speedChart?.resize();
                        state.dirChart?.resize();
                        state.mslpRainChart?.resize();
                    }, 80);
                }

                const nonNullWind = Math.max(wspd.filter((v) => v != null).length, gust.filter((v) => v != null).length, wdir.filter((v) => v != null).length);
                const nonNullMSLP = Math.max(mslp.filter((v) => v != null).length, rain.filter((v) => v != null).length);

                statusEl.textContent = `${state.mode === "wind" ? nonNullWind : nonNullMSLP} pts`;
                setDisabled(false);
            }

            selWindow.addEventListener("change", () => load(parseInt(selWindow.value, 10)));
            selSource.addEventListener("change", () => { showMode(selSource.value); load(parseInt(selWindow.value, 10)); });

            showMode("wind");
            selWindow.value = String(defaultHours);
            load(defaultHours);
        }

        window.attachTimeseriesTo = attachTimeseriesTo;
    </script>
