<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>AuraWind — Solent Live Observations (v10)</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg: #0b1120;
            --card: #111827ee;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #14b8a6;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        #app {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        header {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .6rem .9rem;
            background: linear-gradient(180deg, #0b1120, #0b1120cc);
            border-bottom: 1px solid #0f172a;
            backdrop-filter: blur(6px);
            z-index: 1000;
        }

        header h1 {
            font-size: 1rem;
            margin: 0;
            font-weight: 600;
        }

        header .spacer {
            flex: 1
        }

        header .pill {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: .35rem .6rem;
            border: 1px solid #1f2937;
            background: var(--card);
            border-radius: 999px;
            font-size: .8rem;
        }

        header button {
            background: var(--accent);
            color: #062b2a;
            border: 0;
            border-radius: 10px;
            padding: .45rem .7rem;
            font-weight: 700;
            cursor: pointer;
        }

        header button:disabled {
            opacity: .6;
            cursor: default;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-container {
            background: #0b1120;
        }

        .legend {
            position: absolute;
            right: 12px;
            bottom: 12px;
            z-index: 999;
            background: var(--card);
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 10px 12px;
            color: var(--text);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            font: 12px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        .legend h3 {
            margin: 0 0 6px 0;
            font-size: 12px;
            font-weight: 700;
            color: #d1d5db;
        }

        .legend .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }

        .chip {
            width: 18px;
            height: 10px;
            border-radius: 3px;
            border: 1px solid #0006;
        }

        .popbtn {
            cursor: pointer;
            padding: 4px 8px;
            margin-right: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: 12px sans-serif;
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>
    <div id="app">
        <header>
            <h1>AuraWind — Solent Live Observations</h1>
            <div class="pill" id="status">Loading…</div>
            <div class="spacer"></div>
            <button id="refreshBtn" title="Refresh now">Refresh</button>
        </header>
        <div id="map"></div>
    </div>

    <script>
        console.log('AuraWind index loaded v10');

        /* ---------------- Config ---------------- */
        const OBS_URL = './solent_obs.json';      // relative path
        const AUTO_REFRESH_MS = 10 * 60 * 1000;   // 10 minutes
        const ARROW_SIZE_PX = 96;
        const ARROW_FONT_PX = 20;
        const BREAKS = [0, 3, 5, 10, 20, 22, 30, 33, 40, 60];
        const COLORS = ["#00008b", "#4169e1", "#00ffcc", "#00ff00", "#00cc00",
            "#ff9900", "#ff0000", "#b22222", "#8b008b", "#800080"];

        function lerp(a, b, t) { return a + (b - a) * t; }
        function mixHex(a, b, t) {
            const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
            const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
            const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
            const r = Math.round(lerp(ar, br, t)), g = Math.round(lerp(ag, bg, t)), b2 = Math.round(lerp(ab, bb, t));
            return `#${(r << 16 | g << 8 | b2).toString(16).padStart(6, '0')}`;
        }
        function colorForSpeed(spd) {
            if (spd == null || Number.isNaN(spd)) return "#999999";
            for (let i = 0; i < BREAKS.length - 1; i++) {
                const lo = BREAKS[i], hi = BREAKS[i + 1];
                if (spd <= hi) {
                    const t = Math.max(0, Math.min(1, (spd - lo) / Math.max(1e-9, (hi - lo))));
                    return mixHex(COLORS[i], COLORS[i + 1], t);
                }
            }
            return COLORS[COLORS.length - 1];
        }
        function rotateFromDirDeg(d) { return (Number(d) + 180) % 360; }
        function svgStationArrow(color, size = ARROW_SIZE_PX) {
            const stroke = Math.max(4, size / 12).toFixed(1);
            return `<svg width="${size}" height="${size}" viewBox="0 0 64 64"
          xmlns="http://www.w3.org/2000/svg"
          style="filter: drop-shadow(0 0 3px rgba(0,0,0,0.35));">
        <g transform="translate(32,32)">
          <line x1="0" y1="20" x2="0" y2="-16" stroke="${color}"
                stroke-width="${stroke}" stroke-linecap="round"/>
          <polygon points="0,-26 -10,-8 10,-8" fill="${color}"/>
        </g></svg>`;
        }

        function popupHTML(st) {
            const sid = (st.station_id || '').toString();
            const name = st.station_name || sid || 'Station';
            return `<div style="width:240px;padding:6px;">
        <b>${name}</b><br>${Math.round(st.wspd_kn)} kt<br>${Math.round(st.wdir_degT)}°
      </div>`;
        }

        const map = L.map('map', { zoomControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            { attribution: '&copy; OpenStreetMap, &copy; CARTO' }).addTo(map);
        const layerStations = L.layerGroup().addTo(map);

        const statusEl = document.getElementById('status');
        const refreshBtn = document.getElementById('refreshBtn');
        refreshBtn.addEventListener('click', () => loadObs(true));
        map.on('click', () => map.closePopup());

        function clearStations() { layerStations.clearLayers(); }
        function addStationMarker(st) {
            if (!st.lat || !st.lon || !st.wspd_kn || !st.wdir_degT) return;
            const color = colorForSpeed(st.wspd_kn);
            const rotate = rotateFromDirDeg(st.wdir_degT);
            const arrow = svgStationArrow(color, ARROW_SIZE_PX);
            const html = `<div style="transform:rotate(${rotate}deg)">${arrow}</div>
        <div style="position:relative;top:-${ARROW_SIZE_PX / 2 - 2}px;width:${ARROW_SIZE_PX}px;
        text-align:center;font:600 ${ARROW_FONT_PX}px/1 system-ui;
        color:#111;text-shadow:0 0 2px #fff,0 0 8px rgba(255,255,255,0.95);">
        ${Math.round(st.wspd_kn)}</div>`;
            const icon = L.divIcon({
                html, iconSize: [ARROW_SIZE_PX, ARROW_SIZE_PX],
                iconAnchor: [ARROW_SIZE_PX / 2, ARROW_SIZE_PX / 2], className: ''
            });
            const marker = L.marker([st.lat, st.lon], { icon }).addTo(layerStations);
            marker.bindTooltip(`${st.station_name || st.station_id}<br>${Math.round(st.wspd_kn)} kt`);
            marker.bindPopup(popupHTML(st));
            marker.on('mouseover', () => marker.openPopup());
            marker.on('mouseout', () => marker.closePopup());
        }
        function fitToDataBounds(points) {
            if (!points.length) return;
            let latMin = 90, latMax = -90, lonMin = 180, lonMax = -180;
            for (const p of points) {
                if (p.lat != null && p.lon != null) {
                    latMin = Math.min(latMin, p.lat); latMax = Math.max(latMax, p.lat);
                    lonMin = Math.min(lonMin, p.lon); lonMax = Math.max(lonMax, p.lon);
                }
            }
            const sw = L.latLng(latMin - 0.06, lonMin - 0.1), ne = L.latLng(latMax + 0.06, lonMax + 0.1);
            map.fitBounds(L.latLngBounds(sw, ne), { padding: [20, 20] });
        }

        let autoTimer = null;
        async function loadObs(fromButton = false) {
            try {
                refreshBtn.disabled = true;
                statusEl.textContent = fromButton ? 'Refreshing…' : 'Loading…';

                const url = `${OBS_URL}?ts=${Date.now()}`;
                console.log('Fetching obs URL:', url);

                const res = await fetch(url, { cache: 'no-store' });
                console.log('Fetch status:', res.status, res.statusText);

                if (!res.ok) {
                    statusEl.textContent = `Fetch ${res.status}`;
                    throw new Error(`HTTP ${res.status} ${res.statusText} for ${url}`);
                }

                let data;
                try {
                    data = await res.json();
                } catch (e) {
                    const txt = await res.text();
                    console.error('JSON parse failed. First 200 chars:', txt.slice(0, 200));
                    statusEl.textContent = 'Invalid JSON';
                    throw e;
                }

                let obs = Array.isArray(data?.obs) ? data.obs : Array.isArray(data) ? data : [];
                obs = obs.map(r => ({
                    lat: r.lat ?? r.Lat ?? r.latitude,
                    lon: r.lon ?? r.Lon ?? r.longitude,
                    wspd_kn: r.wspd_kn ?? r.wind_speed_kn ?? r.wspd ?? r.wind_knots,
                    wdir_degT: r.wdir_degT ?? r.wdir ?? r.wind_dir_degT ?? r.direction,
                    station_name: r.station_name ?? r.name ?? r.Site ?? r.station_id ?? r.id,
                    station_id: r.station_id ?? r.id ?? r.code
                }));

                const ok = obs.filter(r => r.lat != null && r.lon != null && r.wspd_kn != null && r.wdir_degT != null);

                clearStations();
                for (const r of ok) addStationMarker(r);

                if (ok.length) {
                    if (!map._fitDone || fromButton) { fitToDataBounds(ok); map._fitDone = true; }
                    const gen = data?.meta?.generated_at || new Date().toISOString();
                    statusEl.textContent = `Stations: ${ok.length} • Updated: ${gen}`;
                } else {
                    console.warn('No valid stations after parsing. Sample:', obs.slice(0, 3));
                    statusEl.textContent = 'No stations in data';
                }
            } catch (err) {
                console.error('loadObs error:', err);
                // leave whatever status text we already set above (Fetch ### / Invalid JSON)
            } finally {
                refreshBtn.disabled = false;
                if (autoTimer) clearTimeout(autoTimer);
                autoTimer = setTimeout(loadObs, AUTO_REFRESH_MS);
            }
        }
        map.whenReady(() => loadObs());
    </script>

    <div class="legend" id="legend">
        <h3>Wind speed (kt)</h3>
        <div class="row"><span class="chip" style="background:#00008b"></span> 0–3</div>
        <div class="row"><span class="chip" style="background:#4169e1"></span> 3–5</div>
        <div class="row"><span class="chip" style="background:#00ffcc"></span> 5–10</div>
        <div class="row"><span class="chip" style="background:#00ff00"></span> 10–20</div>
        <div class="row"><span class="chip" style="background:#00cc00"></span> 20–22</div>
        <div class="row"><span class="chip" style="background:#ff9900"></span> 22–30</div>
        <div class="row"><span class="chip" style="background:#ff0000"></span> 30–33</div>
        <div class="row"><span class="chip" style="background:#b22222"></span> 33–40</div>
        <div class="row"><span class="chip" style="background:#8b008b"></span> 40–60</div>
        <div class="row"><span class="chip" style="background:#800080"></span> 60+</div>
    </div>
</body>

</html>
