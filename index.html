<!-- /index.html -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>AuraWind — Solent Live Observations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js + time adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

    <style>
        :root {
            --bg: #0b1120;
            --text: #0b0f1a;
            --muted: rgba(0, 0, 0, 0.62);
            --accent: #14b8a6;

            --hud-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
            --hud-border: rgba(0, 0, 0, 0.12);
            --hud-bg: rgba(255, 255, 255, 0.88);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        }

        /* Fullscreen map */
        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .leaflet-container {
            background: var(--bg);
        }

        /* Overlay HUD (no header bar) */
        .hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
        }

        .hud-left {
            position: absolute;
            left: 12px;
            top: 2px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            pointer-events: none;
        }

        /* ~2x bigger logo */
        #logo {
            height: clamp(120px, 10vw, 160px);
            width: auto;
            display: block;
            object-fit: contain;
        }

        .hud-title {
            margin-top: 18px;
            line-height: 1.1;
            pointer-events: none;
            color: #0b0f1a;
        }

        .hud-title h1 {
            margin: 0;
            font-size: clamp(28px, 2.6vw, 44px);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .hud-title .sub {
            margin-top: 6px;
            font-size: clamp(13px, 1.2vw, 16px);
            color: rgba(11, 15, 26, 0.72);
            font-weight: 600;
        }

        .hud-title .meta {
            margin-top: 8px;
            font-size: clamp(12px, 1.05vw, 14px);
            color: rgba(11, 15, 26, 0.62);
            font-weight: 600;
        }

        .hud-right {
            position: absolute;
            right: 16px;
            top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            align-items: flex-end;
        }

        .btn {
            pointer-events: auto;
            appearance: none;
            border: 1px solid var(--hud-border);
            background: rgba(20, 184, 166, 0.9);
            color: #05201d;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 10px;
            box-shadow: var(--hud-shadow);
            cursor: pointer;
            user-select: none;
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Legend box */
        .legend {
            pointer-events: auto;
            background: var(--hud-bg);
            border: 1px solid var(--hud-border);
            border-radius: 12px;
            box-shadow: var(--hud-shadow);
            padding: 10px 12px;
            min-width: 180px;
        }

        .legend h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            font-weight: 900;
            color: rgba(11, 15, 26, 0.82);
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
            font-size: 12px;
            font-weight: 700;
            color: rgba(11, 15, 26, 0.72);
        }

        .swatch {
            width: 18px;
            height: 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            flex: 0 0 auto;
        }

        /* Popup canvas container */
        .popup-wrap {
            width: 360px;
            max-width: 92vw;
        }

        .popup-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 8px 0;
        }

        .popup-controls label {
            font-size: 12px;
            font-weight: 800;
            color: rgba(11, 15, 26, 0.65);
        }

        select {
            border: 1px solid rgba(0, 0, 0, 0.18);
            border-radius: 8px;
            padding: 4px 8px;
            font-weight: 800;
            background: white;
        }

        canvas {
            width: 100% !important;
            height: 180px !important;
        }

        .leaflet-popup-content {
            margin: 12px 14px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: var(--hud-shadow);
            font-size: 12px;
            font-weight: 800;
            color: rgba(11, 15, 26, 0.72);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #14b8a6;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="hud">
        <div class="hud-left">
            <img id="logo" src="aura-logo.png" alt="Aura Weather logo" />
            <div class="hud-title">
                <h1>Solent Live Observations</h1>
                <div class="sub">Wind • Gust • Direction • MSLP • Rain</div>
                <div class="meta" id="metaLine">Stations: — • Updated: —</div>
            </div>
        </div>

        <div class="hud-right">
            <button class="btn" id="refreshBtn">Refresh</button>

            <div class="legend" id="legendBox">
                <h3>Wind speed (kt)</h3>
                <div class="legend-row"><span class="swatch" style="background:#2b2d42"></span> 0–3</div>
                <div class="legend-row"><span class="swatch" style="background:#1d3557"></span> 3–5</div>
                <div class="legend-row"><span class="swatch" style="background:#457b9d"></span> 5–10</div>
                <div class="legend-row"><span class="swatch" style="background:#2a9d8f"></span> 10–20</div>
                <div class="legend-row"><span class="swatch" style="background:#2a9d19"></span> 20–22</div>
                <div class="legend-row"><span class="swatch" style="background:#f4a261"></span> 22–30</div>
                <div class="legend-row"><span class="swatch" style="background:#e63946"></span> 30–33</div>
                <div class="legend-row"><span class="swatch" style="background:#c1121f"></span> 33–40</div>
                <div class="legend-row"><span class="swatch" style="background:#780000"></span> 40–60</div>
                <div class="legend-row"><span class="swatch" style="background:#4b0082"></span> 60+</div>
            </div>
        </div>
    </div>

    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ---------------------------
        // Config
        // ---------------------------
        // NOTE: These are public anon keys. If you rotate keys, update them here.
        const SUPABASE_URL = "https://kphwhiwyvqhxvbruxybh.supabase.co";
        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1pby1qd3QiLCJyZWYiOiJrcGh3aGl3eXd2cWh4dmJydXh5YmgiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcyNzkwMDA1NiwiZXhwIjoyMDQzNDc2MDU2fQ.PY1uWSwOUu4HfKZQfP6b2k4HkqO4x9kRpsgCtvv2Qyw";

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------------------------
        // Helpers
        // ---------------------------
        function now() { return Date.now(); }

        function windColor(kt) {
            if (kt == null || isNaN(kt)) return "#999";
            if (kt < 3) return "#2b2d42";
            if (kt < 5) return "#1d3557";
            if (kt < 10) return "#457b9d";
            if (kt < 20) return "#2a9d8f";
            if (kt < 22) return "#2a9d19";
            if (kt < 30) return "#f4a261";
            if (kt < 33) return "#e63946";
            if (kt < 40) return "#c1121f";
            if (kt < 60) return "#780000";
            return "#4b0082";
        }

        function degToRad(d) { return (d * Math.PI) / 180; }
        function radToDeg(r) { return (r * 180) / Math.PI; }

        function averageDirDeg(dirs) {
            // circular mean
            const valid = dirs.filter((d) => d != null && !isNaN(d));
            if (!valid.length) return null;
            let x = 0, y = 0;
            for (const d of valid) {
                const r = degToRad(d);
                x += Math.cos(r);
                y += Math.sin(r);
            }
            const mean = radToDeg(Math.atan2(y, x));
            return (mean + 360) % 360;
        }

        function formatUpdated(tsIso) {
            try {
                const d = new Date(tsIso);
                // Format: YYYY-MM-DDTHH:mm:ssZ
                const pad = (n) => String(n).padStart(2, "0");
                return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}Z`;
            } catch {
                return tsIso;
            }
        }

        // ---------------------------
        // Fetch observations JSON (map markers)
        // ---------------------------
        async function fetchObsJson() {
            const r = await fetch("solent_obs.json", { cache: "no-store" });
            if (!r.ok) throw new Error(`Failed to fetch solent_obs.json: ${r.status}`);
            return r.json();
        }

        // ---------------------------
        // Supabase queries for popup timeseries
        // ---------------------------
        // Cache station code->uuid to avoid repeated lookups
        const stationIdCache = new Map(); // key -> {id, ts}

        async function getStationId(idOrCode) {
            const cached = stationIdCache.get(idOrCode);
            if (cached && now() - cached.ts < 5 * 60 * 1000) return cached.id;

            const { data, error } = await sb
                .from("stations")
                .select("id")
                .eq("code", idOrCode)
                .maybeSingle();

            if (error) {
                console.warn("getStationId error", error);
                return null;
            }

            const id = data?.id || null;
            stationIdCache.set(idOrCode, { id, ts: now() });
            return id;
        }

        // ✅ NEW: normalize timestamps so obs & forecast align in charts
        function toISO(ts) {
            if (!ts) return null;
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return null;
            return d.toISOString();
        }

        function normalizeRow(r) {
            const rawTs = r.observed_at || r.ts || r.time || r.datetime;
            const ts = toISO(rawTs);
            const wspd = r.wind_speed ?? r.wind_speed_kt ?? r.wspd ?? r.wspd_kn ?? null;
            const gust = r.wind_gust ?? r.wind_gust_kt ?? r.gust ?? r.gust_kn ?? null;
            const wdir = r.wind_direction ?? r.wind_dir_deg ?? r.wdir ?? r.dir ?? null;
            const mslp = r.pressure ?? r.mslp_hpa ?? r.mslp ?? null;
            const rain = r.precip_mm ?? r.precipitation ?? null;
            return { ts, wspd, gust, wdir, mslp, rain };
        }

        async function fetchObsSeries(stationUuid, hours, signal) {
            const since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
            const { data, error } = await sb
                .from("observations")
                .select("observed_at, wind_speed_kt, wind_gust_kt, wind_dir_deg, mslp_hpa, precip_mm")
                .eq("station_id", stationUuid)
                .gte("observed_at", since)
                .order("observed_at", { ascending: true })
                .abortSignal(signal);

            if (error) throw error;
            return (data || []).map(normalizeRow);
        }

        async function fetchForecastLatestSeries(stationUuid, hours, maxHours, signal) {
            // Fetch a window of forecast from latest run
            // Table: forecast_hourly_latest with valid_time, wind_speed_kt, wind_gust_kt, wind_dir_deg, mslp_hpa, precip_mm
            const since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
            const until = new Date(Date.now() + maxHours * 3600 * 1000).toISOString();

            const { data, error } = await sb
                .from("forecast_hourly_latest")
                .select("valid_time, wind_speed_kt, wind_gust_kt, wind_dir_deg, mslp_hpa, precip_mm")
                .eq("station_id", stationUuid)
                .gte("valid_time", since)
                .lte("valid_time", until)
                .order("valid_time", { ascending: true })
                .abortSignal(signal);

            if (error) throw error;
            return data || [];
        }

        // ---------------------------
        // Chart utils
        // ---------------------------
        function align(labels, x, y) {
            const map = new Map();
            for (let i = 0; i < x.length; i++) map.set(x[i], y[i]);
            return labels.map((t) => (map.has(t) ? map.get(t) : null));
        }

        function makeCommonOptions() {
            return {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: {
                    legend: { position: "bottom", labels: { boxWidth: 20, usePointStyle: false } },
                    tooltip: { mode: "index", intersect: false },
                },
                interaction: { mode: "index", intersect: false },
                scales: {
                    x: {
                        type: "time",
                        time: { unit: "hour", displayFormats: { hour: "ha" } },
                        ticks: { maxRotation: 45, minRotation: 45 },
                    },
                    y: { beginAtZero: false },
                },
            };
        }

        function makeDirOptions() {
            const o = makeCommonOptions();
            o.scales.y = {
                min: 0,
                max: 360,
                ticks: {
                    callback: (v) => v,
                },
            };
            return o;
        }

        // ---------------------------
        // Popup timeseries renderer
        // ---------------------------
        function attachTimeseriesTo(mount, stationCodeOrId, defaultHours, popup) {
            const state = {
                abort: new AbortController(),
                mode: "wind",
                hours: defaultHours,
                windChart: null,
                dirChart: null,
                mslpRainChart: null,
            };

            mount.innerHTML = `
        <div class="popup-wrap">
          <div class="popup-controls">
            <div>
              <label>Window:</label>
              <select class="js-hours">
                <option value="6">6h</option>
                <option value="24" selected>24h</option>
                <option value="72">72h</option>
              </select>
            </div>

            <div>
              <label>Source:</label>
              <select class="js-mode">
                <option value="wind" selected>Wind</option>
                <option value="mslp">MSLP</option>
                <option value="rain">Rain</option>
              </select>
            </div>
          </div>

          <div class="js-status status-pill" style="display:none">
            <span class="dot"></span><span class="js-status-text">Loading…</span>
          </div>

          <div class="js-charts">
            <canvas class="js-wind"></canvas>
            <canvas class="js-dir" style="margin-top:8px"></canvas>
            <canvas class="js-mslpRain" style="margin-top:8px; display:none"></canvas>
          </div>

          <div class="js-empty" style="display:none; color: rgba(0,0,0,.55); font-weight:800; font-size:12px; margin-top:8px;">
            No data
          </div>
        </div>
      `;

            const selHours = mount.querySelector(".js-hours");
            const selMode = mount.querySelector(".js-mode");
            const elEmpty = mount.querySelector(".js-empty");
            const elStatus = mount.querySelector(".js-status");
            const elStatusText = mount.querySelector(".js-status-text");
            const cWind = mount.querySelector(".js-wind");
            const cDir = mount.querySelector(".js-dir");
            const cMslpRain = mount.querySelector(".js-mslpRain");

            function setStatus(txt) {
                elStatus.style.display = "inline-flex";
                elStatusText.textContent = txt;
            }

            function clearStatus() {
                elStatus.style.display = "none";
            }

            function setEmpty(isEmpty) {
                elEmpty.style.display = isEmpty ? "block" : "none";
            }

            function setDisabled(disabled) {
                selHours.disabled = disabled;
                selMode.disabled = disabled;
            }

            function destroyCharts() {
                state.windChart?.destroy(); state.windChart = null;
                state.dirChart?.destroy(); state.dirChart = null;
                state.mslpRainChart?.destroy(); state.mslpRainChart = null;
            }

            function upsertWindCharts(labels, ts, wspd, gust, wdir, f_ts, f_wspd, f_gust, f_wdir) {
                cWind.style.display = "";
                cDir.style.display = "";
                cMslpRain.style.display = "none";

                const windData = {
                    labels,
                    datasets: [
                        {
                            label: "Wind (kt)",
                            data: align(labels, ts, wspd),
                            borderWidth: 2,
                            fill: false,
                        },
                        {
                            label: "Gust (kt)",
                            data: align(labels, ts, gust),
                            borderWidth: 2,
                            borderDash: [6, 4],
                            fill: false,
                        },
                        {
                            label: "Fcst Wind (kt)",
                            data: align(labels, f_ts, f_wspd),
                            borderWidth: 2,
                            borderDash: [3, 3],
                            fill: false,
                        },
                        {
                            label: "Fcst Gust (kt)",
                            data: align(labels, f_ts, f_gust),
                            borderWidth: 2,
                            borderDash: [1, 3],
                            fill: false,
                        },
                    ],
                };

                const dirData = {
                    labels,
                    datasets: [
                        {
                            label: "Direction (°)",
                            data: align(labels, ts, wdir),
                            borderWidth: 2,
                            fill: false,
                        },
                        {
                            label: "Fcst Dir (°)",
                            data: align(labels, f_ts, f_wdir),
                            borderWidth: 2,
                            borderDash: [3, 3],
                            fill: false,
                        },
                    ],
                };

                if (!state.windChart) {
                    state.windChart = new Chart(cWind.getContext("2d"), {
                        type: "line",
                        data: windData,
                        options: makeCommonOptions(),
                    });
                } else {
                    state.windChart.data = windData;
                    state.windChart.update();
                }

                if (!state.dirChart) {
                    state.dirChart = new Chart(cDir.getContext("2d"), {
                        type: "line",
                        data: dirData,
                        options: makeDirOptions(),
                    });
                } else {
                    state.dirChart.data = dirData;
                    state.dirChart.update();
                }
            }

            function upsertMslpRain(labels, ts, mslp, rain, f_ts, f_mslp, f_rain) {
                cWind.style.display = "none";
                cDir.style.display = "none";
                cMslpRain.style.display = "";

                const isRain = state.mode === "rain";
                const title = isRain ? "Rain (mm)" : "MSLP (hPa)";
                const obs = isRain ? rain : mslp;
                const fcst = isRain ? f_rain : f_mslp;

                const data = {
                    labels,
                    datasets: [
                        {
                            label: title,
                            data: align(labels, ts, obs),
                            borderWidth: 2,
                            fill: false,
                        },
                        {
                            label: `Fcst ${title}`,
                            data: align(labels, f_ts, fcst),
                            borderWidth: 2,
                            borderDash: [3, 3],
                            fill: false,
                        },
                    ],
                };

                const opts = makeCommonOptions();
                if (isRain) opts.scales.y.beginAtZero = true;

                if (!state.mslpRainChart) {
                    state.mslpRainChart = new Chart(cMslpRain.getContext("2d"), {
                        type: "line",
                        data,
                        options: opts,
                    });
                } else {
                    state.mslpRainChart.data = data;
                    state.mslpRainChart.options = opts;
                    state.mslpRainChart.update();
                }
            }

            async function loadAndRender() {
                setDisabled(true);
                setEmpty(false);
                setStatus("Loading…");

                // Abort previous in-flight
                try { state.abort.abort(); } catch { }
                state.abort = new AbortController();

                const hours = Number(selHours.value);
                const mode = selMode.value;
                state.hours = hours;
                state.mode = mode;

                let obsRows = [];
                try {
                    const stationUuid = await getStationId(stationCodeOrId);
                    if (!stationUuid) {
                        destroyCharts();
                        setEmpty(true);
                        clearStatus();
                        setDisabled(false);
                        return;
                    }

                    obsRows = await fetchObsSeries(stationUuid, hours, state.abort.signal);
                } catch (e) {
                    console.warn("obs fetch error", e);
                    destroyCharts();
                    setEmpty(true);
                    clearStatus();
                    setDisabled(false);
                    return;
                }

                if (!obsRows.length) {
                    destroyCharts();
                    setEmpty(true);
                    clearStatus();
                    setDisabled(false);
                    return;
                }

                const ts = obsRows.map((r) => r.ts);
                const wspd = obsRows.map((r) => r.wspd);
                const gust = obsRows.map((r) => r.gust);
                const wdir = obsRows.map((r) => r.wdir);
                const mslp = obsRows.map((r) => r.mslp);
                const rain = obsRows.map((r) => r.rain);

                const stationUuid = await getStationId(stationCodeOrId);
                const fcRows = stationUuid ? await fetchForecastLatestSeries(stationUuid, hours, 48, state.abort.signal) : [];

                // ✅ NEW: normalize forecast timestamps to ISO so they match obs ts
                const f_ts = fcRows.map((r) => toISO(r.valid_time)).filter(Boolean);
                const f_wspd = fcRows.map((r) => r.wind_speed_kt);
                const f_gust = fcRows.map((r) => r.wind_gust_kt);
                const f_wdir = fcRows.map((r) => r.wind_dir_deg);
                const f_mslp = fcRows.map((r) => r.mslp_hpa);
                const f_rain = fcRows.map((r) => r.precip_mm);

                // ✅ NEW: ignore null timestamps when building label set
                const labels = Array.from(new Set([...(ts || []).filter(Boolean), ...(f_ts || []).filter(Boolean)])).sort();

                if (state.mode === "wind") {
                    upsertWindCharts(labels, ts, wspd, gust, wdir, f_ts, f_wspd, f_gust, f_wdir);
                } else if (state.mode === "mslp") {
                    upsertMslpRain(labels, ts, mslp, rain, f_ts, f_mslp, f_rain);
                } else {
                    upsertMslpRain(labels, ts, mslp, rain, f_ts, f_mslp, f_rain);
                }

                clearStatus();
                setDisabled(false);
            }

            selHours.addEventListener("change", loadAndRender);
            selMode.addEventListener("change", loadAndRender);

            // Ensure charts resize correctly inside Leaflet popup
            popup.on("add", () => setTimeout(loadAndRender, 50));
            popup.on("remove", () => {
                try { state.abort.abort(); } catch { }
                destroyCharts();
            });

            // initial
            loadAndRender();
        }

        // ---------------------------
        // Map + markers
        // ---------------------------
        const map = L.map("map", {
            zoomControl: true,
            preferCanvas: true
        }).setView([50.79, -1.26], 10.25);

        // Basemap
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // Custom arrow marker (simple)
        function makeArrowIcon(kt, dirDeg) {
            const color = windColor(kt);
            const size = 28;
            const rot = (dirDeg ?? 0) - 90; // point arrow to direction
            const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 64 64">
        <g transform="translate(32,32) rotate(${rot}) translate(-32,-32)">
          <path d="M8 32 L52 20 L52 28 L56 28 L56 36 L52 36 L52 44 Z" fill="${color}" stroke="rgba(0,0,0,.25)" stroke-width="2" />
        </g>
      </svg>`;
            return L.divIcon({
                className: "",
                html: svg,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2],
            });
        }

        // Marker layer
        const markersLayer = L.layerGroup().addTo(map);

        function stationPopupHtml(st) {
            const name = st.name || st.station_id || st.id || "Station";
            const wspd = st.wind_speed_kt ?? st.wind_speed ?? null;
            const gust = st.wind_gust_kt ?? st.gust ?? null;
            const wdir = st.wind_dir_deg ?? st.wind_dir ?? null;

            const wrap = document.createElement("div");
            wrap.className = "popup-wrap";

            const title = document.createElement("div");
            title.style.fontWeight = "900";
            title.style.marginBottom = "8px";
            title.textContent = name;

            const mount = document.createElement("div");
            wrap.appendChild(title);
            wrap.appendChild(mount);

            // Attach charts on popup open
            return { wrap, mount };
        }

        async function refreshMap() {
            const metaLine = document.getElementById("metaLine");
            markersLayer.clearLayers();

            let json;
            try {
                json = await fetchObsJson();
            } catch (e) {
                console.error(e);
                metaLine.textContent = "Stations: — • Updated: —";
                return;
            }

            const rows = Array.isArray(json) ? json : (json.stations ?? json.obs ?? []);
            const stations = (Array.isArray(rows) ? rows : Object.values(rows)).map((r) => ({
                ...r,
                station_id: r.station_id ?? r.site_id ?? r.id ?? r.name,
            }));



            const updated = json?.meta?.generated_at || json.updated_at || json.updated || new Date().toISOString();
            metaLine.textContent = `Stations: ${stations.length} • Updated: ${formatUpdated(updated)}`;

            for (const st of stations) {
                const lat = st.lat ?? st.latitude;
                const lon = st.lon ?? st.longitude;
                if (lat == null || lon == null) continue;

                const wspd = st.wind_speed_kt ?? st.wind_speed ?? null;
                const wdir = st.wind_dir_deg ?? st.wind_dir ?? null;

                const icon = makeArrowIcon(wspd, wdir);

                const m = L.marker([lat, lon], { icon }).addTo(markersLayer);

                // Add numeric label
                const label = (wspd == null || isNaN(wspd)) ? "" : `${Math.round(wspd)}`;
                if (label) {
                    const labelIcon = L.divIcon({
                        className: "",
                        html: `<div style="
              font-weight: 900;
              font-size: 14px;
              color: #000;
              text-shadow: 0 1px 2px rgba(255,255,255,.8);
              transform: translate(12px, 6px);
            ">${label}</div>`,
                        iconSize: [1, 1],
                        iconAnchor: [0, 0],
                    });
                    L.marker([lat, lon], { icon: labelIcon, interactive: false }).addTo(markersLayer);
                }

                const { wrap, mount } = stationPopupHtml(st);
                const popup = L.popup({ maxWidth: 420 }).setContent(wrap);
                m.bindPopup(popup);

                // When popup opens, attach chart
                m.on("popupopen", () => {
                    attachTimeseriesTo(mount, st.station_id, 24, popup);
                });
            }
        }

        document.getElementById("refreshBtn").addEventListener("click", refreshMap);

        // initial load
        refreshMap();
    </script>
</body>

</html>
