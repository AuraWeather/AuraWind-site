<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura — Solent Live Observations</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --ink: #0b1f2d;
            --panel: rgba(255, 255, 255, .92);
            --panel2: rgba(255, 255, 255, .80);
            --shadow: 0 16px 40px rgba(0, 0, 0, .22);
            --btn: #0b1f2d;
            --btn2: #12bfb1;
            --btnText: #fff;
            --muted: rgba(11, 31, 45, .72);
            --radius: 16px;

            /* popup */
            --popBg: rgba(7, 24, 34, .86);
            --popBorder: rgba(255, 255, 255, .18);
            --popText: rgba(234, 243, 251, .96);
            --popMuted: rgba(234, 243, 251, .72);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #e9eef2;
        }

        /* top overlay header */
        .topbar {
            position: absolute;
            inset: 0 auto auto 0;
            display: flex;
            gap: 18px;
            align-items: flex-start;
            padding: 14px 14px 0 14px;
            pointer-events: none;
            z-index: 1000;
        }

        .logoCard {
            pointer-events: auto;
            width: 160px;
            background: var(--panel);
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .logoCard img {
            display: block;
            width: 100%;
            height: auto;
        }

        .titleBlock {
            pointer-events: auto;
            margin-top: 4px;
            background: rgba(255, 255, 255, .0);
            color: var(--ink);
            text-shadow: none;
        }

        .titleRow {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .titleRow h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.05;
            letter-spacing: .2px;
            color: var(--ink);
        }

        .meta {
            margin-top: 4px;
            font-weight: 800;
            color: rgba(11, 31, 45, .78);
        }

        .meta small {
            font-weight: 800;
        }

        /* top right buttons */
        .btns {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .btn {
            pointer-events: auto;
            border: none;
            border-radius: 14px;
            padding: 12px 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 14px 32px rgba(0, 0, 0, .22);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .btn.flow {
            background: rgba(18, 191, 177, .22);
            color: var(--btn);
            border: 1px solid rgba(18, 191, 177, .45);
        }

        .btn.forecast {
            background: rgba(11, 31, 45, .90);
            color: #fff;
            border: 1px solid rgba(11, 31, 45, .25);
        }

        .btn.refresh {
            background: rgba(18, 191, 177, .95);
            color: #fff;
            border: 1px solid rgba(18, 191, 177, .25);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* legend */
        .legend {
            position: absolute;
            right: 14px;
            bottom: 14px;
            z-index: 1002;
            background: rgba(255, 255, 255, .92);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 12px 12px 10px;
            width: 170px;
            pointer-events: auto;
        }

        .legend h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--ink);
            letter-spacing: .2px;
        }

        .legRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 4px 0;
            font-weight: 800;
            color: rgba(11, 31, 45, .75);
            font-size: 12px;
        }

        .sw {
            width: 22px;
            height: 14px;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
        }

        .legRow span:last-child {
            min-width: 56px;
            text-align: right;
        }

        /* Leaflet popup styling (smaller + dark) */
        .leaflet-popup-content-wrapper {
            background: var(--popBg) !important;
            color: var(--popText) !important;
            border-radius: 14px !important;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .35) !important;
            border: 1px solid var(--popBorder) !important;
        }

        .leaflet-popup-tip {
            background: var(--popBg) !important;
            border: 1px solid var(--popBorder) !important;
        }

        .leaflet-popup-content {
            margin: 10px 12px !important;
            width: 190px !important;
            /* keep it compact */
        }

        .popTitle {
            font-weight: 950;
            letter-spacing: .2px;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .popGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 10px;
            font-weight: 800;
            font-size: 12px;
        }

        .k {
            color: var(--popMuted);
            font-weight: 900;
            letter-spacing: .2px;
        }

        .v {
            color: var(--popText);
            font-weight: 950;
            text-align: right;
        }

        /* station label next to arrow */
        .stationLabel {
            font-weight: 950;
            color: rgba(0, 0, 0, .84);
            text-shadow: 0 2px 10px rgba(255, 255, 255, .9);
            -webkit-text-stroke: 0px;
            letter-spacing: .2px;
        }

        /* canvas flow overlay */
        #flowCanvas {
            position: absolute;
            inset: 0;
            z-index: 650;
            /* above tiles, below markers/popups */
            pointer-events: none;
            /* never block pan/zoom */
            display: none;
        }

        /* Make leaflet controls not clash with legend */
        .leaflet-control-zoom {
            margin-top: 180px !important;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <canvas id="flowCanvas"></canvas>

    <div class="topbar">
        <div class="logoCard">
            <!-- replace with your real logo file -->
            <img src="aura-logo.png" alt="Aura Weather" />
        </div>

        <div class="titleBlock">
            <div class="titleRow">
                <h1>Solent Live<br />Observations</h1>
                <div class="meta">
                    <div id="metaLine1">Stations: — • Updated: —</div>
                    <small>Wind • Gust • Direction</small>
                </div>
            </div>
        </div>
    </div>

    <div class="btns">
        <button id="btnFlow" class="btn flow" type="button">Flow</button>
        <button class="btn forecast" type="button" onclick="location.href='forecast.html'">Forecast</button>
        <button id="btnRefresh" class="btn refresh" type="button">Refresh</button>
    </div>

    <div class="legend" aria-label="Wind speed legend">
        <h3>Wind speed (kt)</h3>
        <div id="legendRows"></div>
    </div>

    <script>
        /* =======================
           CONFIG (edit these)
        ======================= */
        const SUPABASE_URL = "https://bfcavqulacjbwogbjxhm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmY2F2cXVsYWNqYndvZ2JqeGhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Nzc3NzUsImV4cCI6MjA3MjA1Mzc3NX0.XCraHYMFzgnLfeHl1RUjDjnkDm6tYpzgtOQTMNVbr6c";

        /*
          You can point this at whatever you currently use.
          Expected fields (either from joined view or latest table):
          - station_id
          - name (optional) or code
          - latitude, longitude (or lat/lon)
          - wind_speed_kt
          - wind_gust_kt
          - wind_dir_deg
          - observed_time (ISO) OR updated_at
        */
        const OBS_TABLE = "observations";    // <— change if yours differs
        const STATIONS_TABLE = "stations";          // should have id, name/code, latitude, longitude

        // Map bounds: keep it tight around Solent / Central South Coast
        // (This is the “close” view you wanted; tweak if needed.)
        const SOLENT_BOUNDS = L.latLngBounds(
            [50.63, -1.88],  // SW corner (near Hurst / Christchurch)
            [51.15, -0.80]   // NE corner (just east of Portsmouth / inland)
        );

        // Hard max bounds (prevents zooming/panning to the whole UK by accident)
        const MAX_BOUNDS = L.latLngBounds(
            [50.30, -2.60],
            [51.45, -0.20]
        );

        // Marker sizing (keep arrows from becoming huge)
        const ARROW_SIZE_MIN = 18;
        const ARROW_SIZE_MAX = 34;

        // Flow overlay tuning (make flows bigger)
        const FLOW_CFG = {
            particleCount: 260,    // more particles
            particleSize: 1.9,     // bigger dots
            trailAlpha: 0.10,      // lower = longer trails
            stepPx: 1.55,          // advection step per frame
            curl: 0.06,            // small wobble so it looks alive
        };

        /* =======================
           Helpers
        ======================= */
        async function sbGet(path) {
            const url = `${SUPABASE_URL}/rest/v1/${path}`;
            const res = await fetch(url, {
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                    "Accept": "application/json"
                }
            });
            if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${await res.text()}`);
            return res.json();
        }

        function fmt(n, d = 0) { return (n == null || !Number.isFinite(Number(n))) ? "—" : Number(n).toFixed(d); }
        function degToCardinal(deg) {
            if (deg == null || !Number.isFinite(Number(deg))) return "—";
            const dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
            const i = Math.round((((deg % 360) + 360) % 360) / 22.5) % 16;
            return dirs[i];
        }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function windColorKt(kt) {
            // same bins you’ve been using
            if (kt == null || !Number.isFinite(Number(kt))) return "#5c6b7a";
            const w = Number(kt);
            if (w < 3) return "#0b1aa6";
            if (w < 5) return "#2b55d6";
            if (w < 10) return "#00d8c8";
            if (w < 20) return "#00ff2a";
            if (w < 22) return "#00c81a";
            if (w < 30) return "#ffa500";
            if (w < 33) return "#ff0000";
            if (w < 40) return "#b22222";
            if (w < 60) return "#7a1fa2";
            return "#5a0077";
        }

        const LEGEND_BINS = [
            { label: "0–3", c: "#0b1aa6" },
            { label: "3–5", c: "#2b55d6" },
            { label: "5–10", c: "#00d8c8" },
            { label: "10–20", c: "#00ff2a" },
            { label: "20–22", c: "#00c81a" },
            { label: "22–30", c: "#ffa500" },
            { label: "30–33", c: "#ff0000" },
            { label: "33–40", c: "#b22222" },
            { label: "40–60", c: "#7a1fa2" },
            { label: "60+", c: "#5a0077" },
        ];

        function renderLegend() {
            const el = document.getElementById("legendRows");
            el.innerHTML = "";
            for (const b of LEGEND_BINS) {
                const row = document.createElement("div");
                row.className = "legRow";
                row.innerHTML = `<div class="sw" style="background:${b.c}"></div><span>${b.label}</span>`;
                el.appendChild(row);
            }
        }

        /* =======================
           Leaflet init
        ======================= */
        const map = L.map("map", {
            preferCanvas: true,
            zoomControl: true,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            wheelDebounceTime: 20
        });

        // Tiles (Carto light)
        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
            { attribution: '&copy; OpenStreetMap, &copy; CARTO', maxZoom: 14 }
        ).addTo(map);

        // Start tight
        map.fitBounds(SOLENT_BOUNDS, { padding: [20, 20] });
        map.setMaxBounds(MAX_BOUNDS);
        map.options.maxBoundsViscosity = 0.85;
        map.setMinZoom(7);
        map.setMaxZoom(14);

        // Groups
        const markerLayer = L.layerGroup().addTo(map);
        const labelLayer = L.layerGroup().addTo(map);

        // Make sure canvas overlay resizes with map
        const flowCanvas = document.getElementById("flowCanvas");
        const flowCtx = flowCanvas.getContext("2d", { alpha: true });

        function resizeFlowCanvas() {
            const r = document.getElementById("map").getBoundingClientRect();
            flowCanvas.width = Math.round(r.width * devicePixelRatio);
            flowCanvas.height = Math.round(r.height * devicePixelRatio);
            flowCanvas.style.width = r.width + "px";
            flowCanvas.style.height = r.height + "px";
            flowCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        }
        window.addEventListener("resize", resizeFlowCanvas);
        map.on("resize", resizeFlowCanvas);
        map.on("move", () => { if (flowOn) seedParticles(); }); // keep particles aligned when panning
        resizeFlowCanvas();

        /* =======================
           Station markers (arrows)
        ======================= */
        function arrowDivIcon(color, sizePx, rotationDeg) {
            // Arrow is a simple rotated SVG triangle + tail. Size is controlled, rotation is wind direction (from).
            const s = sizePx;
            const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 64 64">
    <defs>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,.35)"/>
      </filter>
    </defs>
    <g filter="url(#sh)" transform="translate(32,32) rotate(${rotationDeg}) translate(-32,-32)">
      <path d="M32 6 L44 30 L36 30 L36 58 L28 58 L28 30 L20 30 Z" fill="${color}" opacity="0.96"/>
    </g>
  </svg>`;
            return L.divIcon({
                className: "",
                html: svg,
                iconSize: [s, s],
                iconAnchor: [s / 2, s / 2]
            });
        }

        function popupHtml(st) {
            const name = st.name || st.code || st.station_id || "Station";
            const w = Number(st.wind_speed_kt);
            const g = Number(st.wind_gust_kt);
            const d = Number(st.wind_dir_deg);
            return `
    <div class="popTitle">${escapeHtml(name)}</div>
    <div class="popGrid">
      <div class="k">WIND</div><div class="v">${fmt(w, 0)} kt</div>
      <div class="k">GUST</div><div class="v">${fmt(g, 0)} kt</div>
      <div class="k">DIR</div><div class="v">${Number.isFinite(d) ? Math.round(d) + "° " + degToCardinal(d) : "—"}</div>
    </div>
  `;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function clearMarkers() {
            markerLayer.clearLayers();
            labelLayer.clearLayers();
        }

        /* =======================
           Flow overlay (particles)
           - vector field built from stations by inverse-distance weighting
           - canvas is pointer-events:none so pan/zoom never breaks
        ======================= */
        let flowOn = false;
        let particles = [];
        let fieldStations = []; // [{lat,lon,u,v}]

        function windUV(spdKt, dirFromDeg) {
            if (!Number.isFinite(spdKt) || !Number.isFinite(dirFromDeg)) return { u: 0, v: 0 };
            const r = dirFromDeg * Math.PI / 180;
            // meteorological "from": u = -spd*sin, v = -spd*cos (kt)
            return { u: -spdKt * Math.sin(r), v: -spdKt * Math.cos(r) };
        }

        function buildFieldFromStations(rows) {
            fieldStations = rows
                .filter(r => Number.isFinite(Number(r.latitude)) && Number.isFinite(Number(r.longitude)))
                .map(r => {
                    const lat = Number(r.latitude), lon = Number(r.longitude);
                    const uv = windUV(Number(r.wind_speed_kt), Number(r.wind_dir_deg));
                    return { lat, lon, u: uv.u, v: uv.v };
                });
        }

        function vectorAtLatLng(lat, lon) {
            // IDW blend, with distance in degrees (fine for small domain)
            if (!fieldStations.length) return { u: 0, v: 0 };
            let su = 0, sv = 0, sw = 0;
            for (const s of fieldStations) {
                const dlat = lat - s.lat;
                const dlon = lon - s.lon;
                const d2 = dlat * dlat + dlon * dlon;
                const w = 1 / Math.max(1e-6, d2); // stronger local influence
                su += s.u * w;
                sv += s.v * w;
                sw += w;
            }
            return { u: su / sw, v: sv / sw };
        }

        function seedParticles() {
            // seed within current map view
            const b = map.getBounds();
            particles = [];
            for (let i = 0; i < FLOW_CFG.particleCount; i++) {
                const lat = b.getSouth() + Math.random() * (b.getNorth() - b.getSouth());
                const lon = b.getWest() + Math.random() * (b.getEast() - b.getWest());
                particles.push({ lat, lon, age: Math.random() * 200 });
            }
        }

        function stepFlow() {
            if (!flowOn) return;

            // fade previous frame for trails
            const w = flowCanvas.clientWidth;
            const h = flowCanvas.clientHeight;
            flowCtx.fillStyle = `rgba(6,27,40,${FLOW_CFG.trailAlpha})`;
            flowCtx.fillRect(0, 0, w, h);

            const b = map.getBounds();

            for (const p of particles) {
                p.age += 1;

                // respawn if out of bounds / too old
                if (p.age > 320 || !b.contains([p.lat, p.lon])) {
                    p.lat = b.getSouth() + Math.random() * (b.getNorth() - b.getSouth());
                    p.lon = b.getWest() + Math.random() * (b.getEast() - b.getWest());
                    p.age = 0;
                    continue;
                }

                const v = vectorAtLatLng(p.lat, p.lon);

                // convert u/v (kt) to pixel-ish motion: scale to degrees using a tiny factor
                // this is a visual overlay, so we tune it rather than physical.
                const speed = Math.hypot(v.u, v.v);
                const scale = (FLOW_CFG.stepPx / 90000) * (1 + 0.06 * speed);

                // small wobble so it doesn’t look too “grid”
                const wob = FLOW_CFG.curl;
                const jx = (Math.random() - 0.5) * wob;
                const jy = (Math.random() - 0.5) * wob;

                const dLat = (v.v * scale) + jy * scale; // v is north/south-ish
                const dLon = (v.u * scale) + jx * scale; // u is east/west-ish

                const prev = map.latLngToContainerPoint([p.lat, p.lon]);
                p.lat += dLat;
                p.lon += dLon;
                const next = map.latLngToContainerPoint([p.lat, p.lon]);

                // draw
                flowCtx.strokeStyle = "rgba(34,184,167,.55)";
                flowCtx.lineWidth = 1.5;
                flowCtx.beginPath();
                flowCtx.moveTo(prev.x, prev.y);
                flowCtx.lineTo(next.x, next.y);
                flowCtx.stroke();

                flowCtx.fillStyle = "rgba(34,184,167,.9)";
                flowCtx.beginPath();
                flowCtx.arc(next.x, next.y, FLOW_CFG.particleSize, 0, Math.PI * 2);
                flowCtx.fill();
            }

            requestAnimationFrame(stepFlow);
        }

        function setFlow(on) {
            flowOn = on;
            flowCanvas.style.display = on ? "block" : "none";
            if (on) {
                resizeFlowCanvas();
                flowCtx.clearRect(0, 0, flowCanvas.clientWidth, flowCanvas.clientHeight);
                seedParticles();
                requestAnimationFrame(stepFlow);
            } else {
                flowCtx.clearRect(0, 0, flowCanvas.clientWidth, flowCanvas.clientHeight);
            }
        }

        /* =======================
           Load & render
        ======================= */
        let lastUpdatedISO = null;

        async function loadAndRender() {
            // 1) load stations
            const stations = await sbGet(`${STATIONS_TABLE}?select=id,code,name,latitude,longitude&order=code.asc`);
            const stById = new Map((stations || []).map(s => [String(s.id), s]));

            // 2) load latest obs
            const obs = await sbGet(`${OBS_TABLE}?select=*`);
            const rows = (obs || []).map(o => {
                const st = stById.get(String(o.station_id)) || {};
                return {
                    ...o,
                    name: st.name ?? o.name ?? st.code ?? o.code,
                    code: st.code ?? o.code,
                    latitude: Number(o.latitude ?? st.latitude),
                    longitude: Number(o.longitude ?? st.longitude),
                    wind_speed_kt: Number(o.wind_speed_kt),
                    wind_gust_kt: Number(o.wind_gust_kt),
                    wind_dir_deg: Number(o.wind_dir_deg),
                    observed_time: o.observed_time ?? o.updated_at ?? o.time ?? null
                };
            }).filter(r => Number.isFinite(r.latitude) && Number.isFinite(r.longitude));

            // meta
            const times = rows.map(r => Date.parse(r.observed_time)).filter(Number.isFinite);
            lastUpdatedISO = times.length ? new Date(Math.max(...times)).toISOString() : null;

            document.getElementById("metaLine1").textContent =
                `Stations: ${rows.length} • Updated: ${lastUpdatedISO ? new Date(lastUpdatedISO).toLocaleString() : "—"}`;

            // render markers
            clearMarkers();

            for (const r of rows) {
                const w = Number(r.wind_speed_kt);
                const dir = Number(r.wind_dir_deg);
                const c = windColorKt(w);

                // size clamp so it never becomes comically huge
                const size = clamp(ARROW_SIZE_MIN + (w || 0) * 0.9, ARROW_SIZE_MIN, ARROW_SIZE_MAX);

                // rotate arrow so it points *towards* where wind is going (optional)
                // If you prefer “from” direction, use (dir) instead of (dir + 180)
                const rot = Number.isFinite(dir) ? (dir + 180) : 0;

                const icon = arrowDivIcon(c, size, rot);
                const m = L.marker([r.latitude, r.longitude], { icon, keyboard: false, riseOnHover: true })
                    .bindPopup(popupHtml(r), { closeButton: false, autoPanPadding: [30, 30], maxWidth: 220 })
                    .addTo(markerLayer);

                // label (speed number) – small + not huge
                const label = L.marker([r.latitude, r.longitude], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="stationLabel">${Number.isFinite(w) ? Math.round(w) : "—"}</div>`,
                        iconSize: [30, 14],
                        iconAnchor: [15, -2]
                    }),
                    interactive: false
                }).addTo(labelLayer);

                // nice hover
                m.on("mouseover", () => m.openPopup());
                m.on("mouseout", () => m.closePopup());
            }

            // flow field
            buildFieldFromStations(rows);
            if (flowOn) seedParticles();

            // keep view tight (only if user hasn’t moved far)
            // If you ALWAYS want it to snap back, uncomment the next line:
            // map.fitBounds(SOLENT_BOUNDS, { padding:[20,20] });
        }

        /* =======================
           UI wiring
        ======================= */
        renderLegend();

        document.getElementById("btnRefresh").addEventListener("click", async () => {
            try { await loadAndRender(); }
            catch (e) { console.error(e); alert("Refresh failed: " + (e.message || e)); }
        });

        document.getElementById("btnFlow").addEventListener("click", () => {
            setFlow(!flowOn);
            document.getElementById("btnFlow").style.background = flowOn ? "rgba(18,191,177,.95)" : "rgba(18,191,177,.22)";
            document.getElementById("btnFlow").style.color = flowOn ? "#fff" : "var(--btn)";
        });

        /* =======================
           Init
        ======================= */
        (async function init() {
            try {
                // Always start in Solent view
                map.fitBounds(SOLENT_BOUNDS, { padding: [20, 20] });
                await loadAndRender();
            } catch (e) {
                console.error(e);
                alert("Init failed: " + (e.message || e));
            }
        })();
    </script>
</body>

</html>
