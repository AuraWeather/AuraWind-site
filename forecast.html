<!-- /forecast.html -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Aura — Forecast (Solent)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js + time adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

  <style>
    :root {
      --bg: #061b28;
      --panel: rgba(255, 255, 255, 0.88);
      --panel2: rgba(255, 255, 255, 0.92);
      --text: #0b0f1a;
      --muted: rgba(0, 0, 0, 0.62);
      --accent: #14b8a6;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.16);
      --border: rgba(0, 0, 0, 0.10);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .leaflet-container {
      background: var(--bg);
    }

    /* Top bar */
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
    }

    .hud-left {
      position: absolute;
      left: 12px;
      top: 6px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      pointer-events: none;
    }

    #logo {
      height: clamp(120px, 11vw, 170px);
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.18));
    }

    .hud-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .hud-title .h1 {
      font-size: clamp(22px, 2.1vw, 34px);
      font-weight: 950;
      letter-spacing: 0.2px;
      line-height: 1.05;
    }

    .hud-title .sub {
      font-size: clamp(14px, 1.2vw, 18px);
      font-weight: 750;
      opacity: 0.85;
      line-height: 1.05;
    }

    .hud-right {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: auto;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 0.58rem 0.95rem;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
      text-decoration: none;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      background: rgba(20, 184, 166, 0.88);
      border: 1px solid rgba(20, 184, 166, 0.55);
    }

    .btn.secondary {
      background: rgba(6, 27, 40, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.20);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    /* Control card */
    .card {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: min(420px, calc(100vw - 24px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      padding: 12px 12px;
      z-index: 900;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    label {
      font-size: 12px;
      font-weight: 800;
      color: rgba(0, 0, 0, 0.70);
    }

    select {
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.16);
      background: var(--panel2);
      outline: none;
      min-width: 240px;
    }

    .seg {
      display: inline-flex;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.70);
    }

    .seg button {
      border: 0;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 900;
      background: transparent;
      color: rgba(0, 0, 0, 0.72);
    }

    .seg button.active {
      background: rgba(20, 184, 166, 0.20);
      color: rgba(0, 0, 0, 0.85);
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.66);
      font-weight: 700;
    }

    /* Chart panel */
    .chart {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: min(640px, calc(100vw - 24px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      padding: 12px 12px;
      z-index: 900;
    }

    .chart h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 950;
      color: rgba(0, 0, 0, 0.80);
    }

    .chart .wrap {
      width: 100%;
      height: 260px;
      position: relative;
    }

    .chart .wrap.small {
      height: 170px;
      margin-top: 10px;
    }

    @media (max-width: 980px) {
      .chart {
        left: 12px;
        right: 12px;
        bottom: 190px;
        width: auto;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="hud">
    <div class="hud-left">
      <img id="logo" src="aura-logo.png" alt="Aura" />
      <div class="hud-title">
        <div class="h1">Forecast</div>
        <div class="sub">Station wind • gust • direction</div>
      </div>
    </div>

    <div class="hud-right">
      <a class="btn secondary" href="./index.html">Live map</a>
      <button id="refreshBtn" class="btn">Refresh</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="stationSel">Station</label>
        <select id="stationSel"></select>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
        <label>Window</label>
        <div class="seg" id="windowSeg">
          <button data-h="24" class="active">24h</button>
          <button data-h="48">48h</button>
          <button data-h="72">72h</button>
        </div>
      </div>
    </div>

    <div class="status" id="status">Loading…</div>
  </div>

  <div class="chart">
    <h3>Wind & Gust (kt)</h3>
    <div class="wrap">
      <canvas id="chartSpeed"></canvas>
    </div>
    <div class="wrap small">
      <canvas id="chartDir"></canvas>
    </div>
  </div>

  <script>
    /* ---------------- Config ---------------- */
    const STATIONS_URL = "/api/stations";
    const FORECAST_URL = "/api/forecast";

    // Solent-ish bounds (keep it consistent)
    const SOLENT_BOUNDS = L.latLngBounds(
      L.latLng(50.65, -2.20),
      L.latLng(51.20, -0.80)
    );

    const statusEl = document.getElementById("status");
    const setStatus = (s) => statusEl.textContent = s;

    const stationSel = document.getElementById("stationSel");
    const refreshBtn = document.getElementById("refreshBtn");
    const windowSeg = document.getElementById("windowSeg");

    let stations = [];
    let selectedHours = 24;

    /* ---------------- Map ---------------- */
    const map = L.map("map", {
      zoomControl: true,
      maxBounds: SOLENT_BOUNDS,
      maxBoundsViscosity: 1.0,
      maxZoom: 13
    });

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap, &copy; CARTO",
    }).addTo(map);

    map.fitBounds(SOLENT_BOUNDS, { padding: [30, 30] });

    function clampZoomToBounds() {
      const minZ = map.getBoundsZoom(SOLENT_BOUNDS, false, [30, 30]);
      map.setMinZoom(minZ);
    }
    clampZoomToBounds();
    window.addEventListener("resize", clampZoomToBounds);

    const layerMarkers = L.layerGroup().addTo(map);

    function addStationPin(st) {
      const m = L.circleMarker([st.latitude, st.longitude], {
        radius: 7,
        weight: 2,
        color: "rgba(20,184,166,0.95)",
        fillColor: "rgba(20,184,166,0.35)",
        fillOpacity: 1
      }).addTo(layerMarkers);

      m.bindTooltip(st.name || st.code || st.id);

      m.on("click", () => {
        stationSel.value = st.id;
        loadForecast();
      });
    }

    /* ---------------- Charts ---------------- */
    const C_WIND = "#14b8a6";
    const C_GUST = "#ff4d7d";
    const C_FC_DIR = "#6a5cff";

    function rgba(hex, a) {
      const h = String(hex).replace("#", "");
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    let chartSpeed = null;
    let chartDir = null;

    function upsertCharts(rows) {
      // Expect rows like:
      // { valid_time, wind_speed_kt, wind_gust_kt, wind_dir_deg }
      const labels = rows.map(r => new Date(r.valid_time).toISOString());
      const wspd = rows.map(r => r.wind_speed_kt ?? null);
      const gust = rows.map(r => r.wind_gust_kt ?? null);
      const wdir = rows.map(r => r.wind_dir_deg ?? null);

      const speedData = {
        labels,
        datasets: [
          {
            label: "Wind (kt)",
            data: wspd,
            borderColor: C_WIND,
            backgroundColor: rgba(C_WIND, 0.18),
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.25
          },
          {
            label: "Gust (kt)",
            data: gust,
            borderColor: C_GUST,
            backgroundColor: rgba(C_GUST, 0.14),
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.25,
            borderDash: [6, 4]
          }
        ]
      };

      const nonNull = [...wspd, ...gust].filter(v => v != null);
      const maxY = Math.max(10, ...(nonNull.length ? nonNull : [0]));

      const speedOpts = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "bottom",
            labels: { boxWidth: 14, boxHeight: 10, color: "rgba(0,0,0,0.75)" }
          },
          tooltip: { mode: "index", intersect: false }
        },
        scales: {
          x: { type: "time", ticks: { color: "rgba(0,0,0,0.65)" }, grid: { color: "rgba(0,0,0,0.08)" } },
          y: { suggestedMax: maxY, ticks: { color: "rgba(0,0,0,0.65)" }, grid: { color: "rgba(0,0,0,0.08)" }, title: { display: true, text: "kt", color: "rgba(0,0,0,0.6)" } }
        },
        animation: { duration: 120 }
      };

      const dirData = {
        labels,
        datasets: [
          {
            label: "Direction (°)",
            data: wdir,
            borderColor: C_FC_DIR,
            backgroundColor: rgba(C_FC_DIR, 0.10),
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.25
          }
        ]
      };

      const dirOpts = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { mode: "index", intersect: false } },
        scales: {
          x: { type: "time", ticks: { color: "rgba(0,0,0,0.65)" }, grid: { color: "rgba(0,0,0,0.08)" } },
          y: { min: 0, max: 360, ticks: { stepSize: 90, color: "rgba(0,0,0,0.65)" }, grid: { color: "rgba(0,0,0,0.08)" } }
        },
        animation: { duration: 120 }
      };

      const ctxS = document.getElementById("chartSpeed").getContext("2d");
      const ctxD = document.getElementById("chartDir").getContext("2d");

      if (!chartSpeed) chartSpeed = new Chart(ctxS, { type: "line", data: speedData, options: speedOpts });
      else { chartSpeed.data = speedData; chartSpeed.options = speedOpts; chartSpeed.update(); }

      if (!chartDir) chartDir = new Chart(ctxD, { type: "line", data: dirData, options: dirOpts });
      else { chartDir.data = dirData; chartDir.options = dirOpts; chartDir.update(); }
    }

    /* ---------------- Data loading ---------------- */
    function isoWindow(hoursForward) {
      const start = new Date();
      const end = new Date(start.getTime() + hoursForward * 3600 * 1000);
      return { startISO: start.toISOString(), endISO: end.toISOString() };
    }

    async function loadStations() {
      setStatus("Loading stations…");
      const res = await fetch(`${STATIONS_URL}?ts=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`Stations HTTP ${res.status}`);
      stations = await res.json();

      // dropdown
      stationSel.innerHTML = "";
      stations
        .filter(s => s?.id && s.latitude != null && s.longitude != null)
        .sort((a, b) => String(a.name || a.code || "").localeCompare(String(b.name || b.code || "")))
        .forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.textContent = s.name || s.code || s.id;
          stationSel.appendChild(opt);
        });

      // map pins
      layerMarkers.clearLayers();
      stations
        .filter(s => s?.id && s.latitude != null && s.longitude != null)
        .forEach(addStationPin);

      // default selection
      if (stationSel.options.length) stationSel.value = stationSel.options[0].value;

      setStatus(`Stations loaded: ${stations.length}`);
    }

    async function loadForecast() {
      try {
        refreshBtn.disabled = true;
        const stationId = stationSel.value;
        if (!stationId) { setStatus("Pick a station"); return; }

        setStatus("Loading forecast…");

        const { startISO, endISO } = isoWindow(selectedHours);
        const url = `${FORECAST_URL}?station=${encodeURIComponent(stationId)}&start=${encodeURIComponent(startISO)}&end=${encodeURIComponent(endISO)}&ts=${Date.now()}`;

        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`Forecast HTTP ${res.status}`);

        const rows = await res.json();
        if (!Array.isArray(rows) || !rows.length) {
          setStatus("No forecast rows returned");
          return;
        }

        // Make sure sorted
        rows.sort((a, b) => new Date(a.valid_time) - new Date(b.valid_time));

        upsertCharts(rows);

        const stName = stations.find(s => s.id === stationId)?.name || "Station";
        setStatus(`${stName} • ${selectedHours}h • updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
      } catch (e) {
        console.error(e);
        setStatus("Forecast load failed");
      } finally {
        refreshBtn.disabled = false;
      }
    }

    /* ---------------- Events ---------------- */
    stationSel.addEventListener("change", () => loadForecast());
    refreshBtn.addEventListener("click", () => loadForecast());

    windowSeg.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-h]");
      if (!btn) return;
      [...windowSeg.querySelectorAll("button")].forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedHours = parseInt(btn.dataset.h, 10);
      loadForecast();
    });

    (async function main() {
      try {
        await loadStations();
        await loadForecast();
      } catch (e) {
        console.error(e);
        setStatus("Init failed");
      }
    })();
  </script>
</body>

</html>
