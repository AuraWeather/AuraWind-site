<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Weather — Solent Live Observations</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #map {
            position: fixed;
            inset: 0;
        }

        .header {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 14px 18px;
            border-radius: 14px;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .refresh-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: #22b8a7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2 style="margin:0;">Solent Live Observations</h2>
        <div id="metaLine" style="font-size:13px;color:#555;margin-top:4px;"></div>
    </div>

    <button class="refresh-btn" onclick="refreshMap()">Refresh</button>

    <div id="map"></div>

    <script>
        /* ================================
           CONFIG
        ================================ */
        const SUPABASE_URL = "https://bfcavqulacjbwogbjxhm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmY2F2cXVsYWNqYndvZ2JqeGhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Nzc3NzUsImV4cCI6MjA3MjA1Mzc3NX0.XCraHYMFzgnLfeHl1RUjDjnkDm6tYpzgtOQTMNVbr6c"

        /* ================================
           MAP INIT
        ================================ */
        const map = L.map("map").setView([50.8, -1.3], 10);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        /* ================================
           WIND COLOUR SCALE
        ================================ */
        function getWindColor(speed) {
            if (speed < 3) return "#2c2f5a";
            if (speed < 5) return "#203a5e";
            if (speed < 10) return "#3f7ea3";
            if (speed < 20) return "#2ca58d";
            if (speed < 22) return "#2faa32";
            if (speed < 30) return "#f0a35e";
            if (speed < 33) return "#e34c4c";
            if (speed < 40) return "#c80000";
            if (speed < 60) return "#8b0000";
            return "#5a007f";
        }

        /* ================================
           AURA ARROW STYLE
        ================================ */
        function makeArrowIcon(directionDeg, speedKt) {
            const size = 34;
            const center = size / 2;
            const color = getWindColor(speedKt);

            const svg = `
<svg width="${size}" height="${size}" viewBox="0 0 34 34"
     xmlns="http://www.w3.org/2000/svg"
     style="transform: rotate(${directionDeg}deg); transform-origin: 50% 50%;">

  <line x1="${center}" y1="28"
        x2="${center}" y2="10"
        stroke="${color}"
        stroke-width="4"
        stroke-linecap="round" />

  <polygon points="${center - 6},12 ${center + 6},12 ${center},4"
           fill="${color}" />
</svg>
`;

            return L.divIcon({
                html: svg,
                className: "",
                iconSize: [size, size],
                iconAnchor: [center, center]
            });
        }

        /* ================================
           FETCH OBS JSON
        ================================ */
        async function fetchObs() {
            const res = await fetch("solent_obs.json", { cache: "no-store" });
            if (!res.ok) throw new Error("JSON fetch failed");
            return res.json();
        }

        /* ================================
           GET STATION UUID FROM SUPABASE
        ================================ */
        async function getStationId(code) {
            const url = `${SUPABASE_URL}/rest/v1/stations?code=eq.${encodeURIComponent(code)}&select=id`;

            const res = await fetch(url, {
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                }
            });

            if (!res.ok) {
                console.error("Station lookup failed:", await res.text());
                return null;
            }

            const data = await res.json();
            return data.length ? data[0].id : null;
        }

        /* ================================
           MAIN REFRESH
        ================================ */
        async function refreshMap() {
            try {
                markersLayer.clearLayers();

                const json = await fetchObs();

                const rows = Array.isArray(json)
                    ? json
                    : (json.obs ?? json.stations ?? []);

                const updated =
                    json?.meta?.generated_at ??
                    new Date().toISOString();

                document.getElementById("metaLine").innerText =
                    `Stations: ${rows.length} • Updated: ${new Date(updated).toLocaleString()}`;

                rows.forEach(row => {
                    if (!row.lat || !row.lon) return;

                    const marker = L.marker(
                        [row.lat, row.lon],
                        {
                            icon: makeArrowIcon(row.wind_dir_deg || 0, row.wind_speed_kt || 0)
                        }
                    ).addTo(markersLayer);

                    marker.bindPopup(`
                <strong>${row.station_name || row.site_id}</strong><br>
                Wind: ${row.wind_speed_kt ?? "-"} kt<br>
                Gust: ${row.wind_gust_kt ?? "-"} kt<br>
                Dir: ${row.wind_dir_deg ?? "-"}°<br>
                Temp: ${row.air_temp_c ?? "-"}°C
            `);
                });

            } catch (err) {
                console.error("obs fetch error", err);
            }
        }

        /* ================================
           INIT
        ================================ */
        refreshMap();
    </script>

</body>

</html>
