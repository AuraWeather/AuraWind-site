<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>AuraWind — Solent Live Observations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chart.js + time adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <style>
        :root {
            --bg: #0b1120;
            --card: #111827ee;
            --text: #e5e7eb;
            --accent: #14b8a6;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        #app {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        header {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .6rem .9rem;
            background: linear-gradient(180deg, #0b1120, #0b1120cc);
            border-bottom: 1px solid #0f172a;
            backdrop-filter: blur(6px);
            z-index: 1000
        }

        header h1 {
            font-size: 1rem;
            margin: 0;
            font-weight: 600
        }

        .spacer {
            flex: 1
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: .35rem .6rem;
            border: 1px solid #1f2937;
            background: var(--card);
            border-radius: 999px;
            font-size: .8rem
        }

        button {
            background: var(--accent);
            color: #062b2a;
            border: 0;
            border-radius: 10px;
            padding: .45rem .7rem;
            font-weight: 700;
            cursor: pointer
        }

        button:disabled {
            opacity: .6;
            cursor: default
        }

        #map {
            width: 100%;
            height: 100%
        }

        .leaflet-container {
            background: #0b1120
        }

        .legend {
            position: absolute;
            right: 12px;
            bottom: 12px;
            z-index: 999;
            background: var(--card);
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 10px 12px;
            color: var(--text);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial
        }

        .legend h3 {
            margin: 0 0 6px 0;
            font-size: 12px;
            font-weight: 700;
            color: #d1d5db
        }

        .legend .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0
        }

        .chip {
            width: 18px;
            height: 10px;
            border-radius: 3px;
            border: 1px solid #0006
        }
    </style>
</head>

<body>
    <div id="app">
        <header>
            <h1>Solent Live Observations</h1>
            <div class="pill" id="status">Loading…</div>
            <div class="spacer"></div>
            <button id="refreshBtn" title="Refresh now">Refresh</button>
        </header>
        <div id="map"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const setStatus = s => { if (statusEl) statusEl.textContent = s; };
        window.addEventListener('error', e => { console.error('Global error:', e.error || e.message); setStatus('Script error'); });
        window.addEventListener('unhandledrejection', e => { console.error('Unhandled promise:', e.reason); setStatus('Load failed'); });

        /* ---------------- Config ---------------- */
        const OBS_URL = './solent_obs.json';
        const AUTO_REFRESH_MS = 10 * 60 * 1000;
        const ARROW_SIZE_PX = 96;
        const ARROW_FONT_PX = 20;
        const BREAKS = [0, 3, 5, 10, 20, 22, 30, 33, 40, 60];
        const COLORS = ["#00008b", "#4169e1", "#00ffcc", "#00ff00", "#00cc00", "#ff9900", "#ff0000", "#b22222", "#8b008b", "#800080"];

        const lerp = (a, b, t) => a + (b - a) * t;
        function mixHex(a, b, t) {
            const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
            const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
            const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
            const r = Math.round(lerp(ar, br, t)), g = Math.round(lerp(ag, bg, t)), b2 = Math.round(lerp(ab, bb, t));
            return `#${(r << 16 | g << 8 | b2).toString(16).padStart(6, '0')}`;
        }
        function colorForSpeed(spd) {
            if (spd == null || Number.isNaN(spd)) return "#999999";
            for (let i = 0; i < BREAKS.length - 1; i++) {
                const lo = BREAKS[i], hi = BREAKS[i + 1];
                if (spd <= hi) {
                    const t = Math.max(0, Math.min(1, (spd - lo) / Math.max(1e-9, hi - lo)));
                    return mixHex(COLORS[i], COLORS[i + 1], t);
                }
            }
            return COLORS.at(-1);
        }
        const rotateFromDirDeg = d => (Number(d) + 180) % 360;
        function svgStationArrow(color, size = ARROW_SIZE_PX) {
            const stroke = Math.max(4, size / 12).toFixed(1);
            return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 0 3px rgba(0,0,0,.35));">
        <g transform="translate(32,32)">
          <line x1="0" y1="20" x2="0" y2="-16" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"/>
          <polygon points="0,-26 -10,-8 10,-8" fill="${color}"/>
        </g></svg>`;
        }

        // map + layers
        const map = L.map('map', { zoomControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            { attribution: '&copy; OpenStreetMap, &copy; CARTO' }).addTo(map);
        const layerStations = L.layerGroup().addTo(map);
        const refreshBtn = document.getElementById('refreshBtn');
        refreshBtn.addEventListener('click', () => loadObs(true));

        function clearStations() { layerStations.clearLayers(); }

        function addStationMarker(st) {
            if (st.lat == null || st.lon == null || st.wspd_kn == null || st.wdir_degT == null) return;

            const color = colorForSpeed(st.wspd_kn);
            const rotate = rotateFromDirDeg(st.wdir_degT);
            const arrow = svgStationArrow(color, ARROW_SIZE_PX);

            const html = `<div style="transform:rotate(${rotate}deg)">${arrow}</div>
        <div style="position:relative;top:-${ARROW_SIZE_PX / 2 - 2}px;width:${ARROW_SIZE_PX}px;text-align:center;
          font:600 ${ARROW_FONT_PX}px/1 system-ui;color:#111;
          text-shadow:0 0 2px #fff,0 0 8px rgba(255,255,255,.95);">${Math.round(st.wspd_kn)}</div>`;

            const icon = L.divIcon({ html, iconSize: [ARROW_SIZE_PX, ARROW_SIZE_PX], iconAnchor: [ARROW_SIZE_PX / 2, ARROW_SIZE_PX / 2], className: '' });
            const m = L.marker([st.lat, st.lon], { icon }).addTo(layerStations);

            const gustText = st.gust_kn == null ? '' : ` gust ${Math.round(st.gust_kn)}`;
            m.bindTooltip(`${st.station_name || st.station_id}<br>${Math.round(st.wspd_kn)} kt${gustText}`);

            m.on('click', (e) => {
                L.DomEvent.stop(e);
                const mount = document.createElement('div');
                mount.style.width = '400px';
                const popup = L.popup({ maxWidth: 480, autoClose: true, closeOnClick: true, closeButton: false, offset: [0, -12] })
                    .setLatLng([st.lat, st.lon])
                    .setContent(mount)
                    .openOn(map);
                if (window.attachTimeseriesTo) {
                    attachTimeseriesTo(mount, st.station_id, 24, popup);
                }
            });
        }

        function fitToDataBounds(points) {
            if (!points.length) return;
            let latMin = 90, latMax = -90, lonMin = 180, lonMax = -180;
            for (const p of points) {
                if (p.lat != null && p.lon != null) {
                    latMin = Math.min(latMin, p.lat); latMax = Math.max(latMax, p.lat);
                    lonMin = Math.min(lonMin, p.lon); lonMax = Math.max(lonMax, p.lon);
                }
            }
            map.fitBounds([[latMin - 0.06, lonMin - 0.10], [latMax + 0.06, lonMax + 0.10]], { padding: [20, 20] });
        }

        let autoTimer = null;
        async function loadObs(fromButton = false) {
            try {
                refreshBtn.disabled = true; setStatus(fromButton ? 'Refreshing…' : 'Loading…');
                const res = await fetch(`${OBS_URL}?ts=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) { setStatus(`Fetch ${res.status}`); throw new Error(`HTTP ${res.status}`); }
                let data; try { data = await res.json(); } catch (e) { const txt = await res.text(); console.error('JSON parse failed:', txt.slice(0, 200)); setStatus('Invalid JSON'); throw e; }

                const rows = Array.isArray(data?.obs) ? data.obs : Array.isArray(data) ? data : [];
                const obs = rows.map(r => ({
                    lat: r.lat ?? r.latitude,
                    lon: r.lon ?? r.longitude,
                    wspd_kn: r.wspd_kn ?? r.wind_speed_kt ?? r.wspd ?? r.wind_knots,
                    gust_kn: r.gust_kn ?? r.wind_gust_kt ?? r.wind_gust ?? r.gust ?? null,
                    wdir_degT: r.wdir_degT ?? r.wind_dir_deg ?? r.wdir ?? r.direction,
                    station_name: r.station_name ?? r.name ?? r.Site ?? r.station_id ?? r.site_id ?? r.id,
                    station_id: r.station_id ?? r.site_id ?? r.id
                }));
                const ok = obs.filter(r => r.lat != null && r.lon != null && r.wspd_kn != null && r.wdir_degT != null);

                clearStations();
                for (const r of ok) addStationMarker(r);

                if (ok.length) {
                    if (!map._fitDone || fromButton) { fitToDataBounds(ok); map._fitDone = true; }
                    const gen = data?.meta?.generated_at || new Date().toISOString();
                    setStatus(`Stations: ${ok.length} • Updated: ${gen}`);
                } else {
                    setStatus('No stations in data');
                    console.warn('Sample rows:', rows.slice(0, 3));
                }
            } catch (e) {
                console.error(e);
                setStatus('Load failed');
            } finally {
                refreshBtn.disabled = false;
                if (autoTimer) clearTimeout(autoTimer);
                autoTimer = setTimeout(loadObs, AUTO_REFRESH_MS);
            }
        }

        map.whenReady(() => loadObs());
    </script>

    <!-- Legend -->
    <div class="legend" id="legend">
        <h3>Wind speed (kt)</h3>
        <div class="row"><span class="chip" style="background:#00008b"></span> 0–3</div>
        <div class="row"><span class="chip" style="background:#4169e1"></span> 3–5</div>
        <div class="row"><span class="chip" style="background:#00ffcc"></span> 5–10</div>
        <div class="row"><span class="chip" style="background:#00ff00"></span> 10–20</div>
        <div class="row"><span class="chip" style="background:#00cc00"></span> 20–22</div>
        <div class="row"><span class="chip" style="background:#ff9900"></span> 22–30</div>
        <div class="row"><span class="chip" style="background:#ff0000"></span> 30–33</div>
        <div class="row"><span class="chip" style="background:#b22222"></span> 33–40</div>
        <div class="row"><span class="chip" style="background:#8b008b"></span> 40–60</div>
        <div class="row"><span class="chip" style="background:#800080"></span> 60+</div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Time-series helpers (Chart.js + caching + abort) -->
    <script>
        // 🔧 Set your Supabase project credentials
        const SUPABASE_URL = "https://bfcavqulacjbwogbjxhm.supabase.co";      // e.g. "https://xyzcompany.supabase.co"
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmY2F2cXVsYWNqYndvZ2JqeGhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Nzc3NzUsImV4cCI6MjA3MjA1Mzc3NX0.XCraHYMFzgnLfeHl1RUjDjnkDm6tYpzgtOQTMNVbr6c"; // e.g. "eyJhbGciOiJI..." (anon public)
        const supabase = window.supabase.createClient(String(SUPABASE_URL).trim(), String(SUPABASE_ANON_KEY).trim());
        console.log('[TS] Supabase URL:', SUPABASE_URL);

        // ---- Caches (define early: avoids TDZ errors) ---------------------------
        const stationIdCache = new Map(); // code -> {id, ts}
        const seriesCache = new Map();    // key(code|hours) -> {data, ts}
        const STATION_CACHE_MS = 24 * 3600 * 1000;
        const SERIES_CACHE_MS = 2 * 60 * 1000;
        const now = () => Date.now();

        const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

        function windowISO(hours, ref = new Date()) {
            const end = new Date(ref), start = new Date(end.getTime() - hours * 3600 * 1000);
            return { startISO: start.toISOString(), endISO: end.toISOString() };
        }
        // unwrap if you want to plot heading continuity; not used for the bottom chart (we keep 0–360)
        function unwrapDegrees(series) {
            if (!series || !series.length) return series;
            const out = []; let acc;
            for (const v of series) {
                if (v == null || isNaN(v)) { out.push(null); continue; }
                if (acc === undefined) { acc = v; out.push(acc); continue; }
                let dv = v - (acc % 360); if (dv > 180) dv -= 360; if (dv < -180) dv += 360;
                acc += dv; out.push(acc);
            }
            return out;
        }

        async function getStationIdByCode(stationCode) {
            if (!stationCode) return null;
            if (UUID_RE.test(stationCode)) return stationCode;
            const cached = stationIdCache.get(stationCode);
            if (cached && (now() - cached.ts) < STATION_CACHE_MS) { return cached.id; }

            const { data, error } = await supabase
                .from('stations')
                .select('id')
                .eq('code', stationCode)
                .limit(1)
                .maybeSingle();

            if (error) { console.error('[stations lookup]', error); return null; }
            const id = data?.id || null;
            stationIdCache.set(stationCode, { id, ts: now() });
            return id;
        }

        async function fetchObsSeriesByCode(stationCode, hours, signal) {
            const cacheKey = `${stationCode}|${hours}`;
            const cached = seriesCache.get(cacheKey);
            if (cached && (now() - cached.ts) < SERIES_CACHE_MS) { return cached.data; }

            const stationId = await getStationIdByCode(stationCode);
            if (!stationId) return [];

            const { startISO, endISO } = windowISO(hours);
            let query = supabase
                .from('observations')
                .select('observed_at, wind_speed, wind_gust, wind_direction')
                .eq('station_id', stationId)
                .gte('observed_at', startISO)
                .lte('observed_at', endISO)
                .order('observed_at', { ascending: true });

            if (typeof query.abortSignal === 'function' && signal) query = query.abortSignal(signal);

            const { data, error } = await query;
            if (signal?.aborted) return [];
            if (error) { console.error('[observations select]', error); return []; }

            const rows = (data || []).map(r => ({ ts: r.observed_at, wspd: r.wind_speed, gust: r.wind_gust, wdir: r.wind_direction }));
            seriesCache.set(cacheKey, { data: rows, ts: now() });
            return rows;
        }

        // ------------- Popup: two stacked charts (Speed/Gust top, Direction bottom) -------------
        async function attachTimeseriesTo(containerEl, stationCode, defaultHours = 6, leafletPopup = null) {
            if (containerEl.dataset.bound === "1") return;
            containerEl.dataset.bound = "1";
            containerEl.__tsState = { req: 0, abort: null, speedChart: null, dirChart: null };

            containerEl.innerHTML = `
        <div style="width:380px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:12px;opacity:.7;">Window:</span>
            <select class="ts-window" style="font-size:12px;padding:2px 4px;">
              <option value="3">3h</option>
              <option value="6">6h</option>
              <option value="12">12h</option>
              <option value="24">24h</option>
            </select>
          </div>
          <div style="width:100%;height:180px;position:relative;margin-bottom:10px;">
            <canvas class="ts-canvas-speed" style="width:360px;height:180px;"></canvas>
          </div>
          <div style="width:100%;height:140px;position:relative;">
            <canvas class="ts-canvas-dir" style="width:360px;height:140px;"></canvas>
          </div>
          <div class="ts-status" style="font-size:12px;opacity:.75;margin-top:6px;"></div>
        </div>`;

            const sel = containerEl.querySelector('.ts-window');
            const speedCtx = containerEl.querySelector('.ts-canvas-speed').getContext('2d');
            const dirCtx = containerEl.querySelector('.ts-canvas-dir').getContext('2d');
            const statusEl = containerEl.querySelector('.ts-status');

            function setDisabled(disabled) { sel.disabled = disabled; }

            function upsertCharts(ts, wspd, gust, wdir) {
                // Speed/Gust (kt)
                const speedData = {
                    labels: ts,
                    datasets: [
                        { label: 'Wind (kt)', data: wspd, borderWidth: 2, pointRadius: 0, tension: 0.25 },
                        { label: 'Gust (kt)', data: gust, borderWidth: 1, borderDash: [4, 3], pointRadius: 0, tension: 0.25 }
                    ]
                };
                const speedOpts = {
                    responsive: true, maintainAspectRatio: false, parsing: false,
                    scales: { x: { type: 'time', ticks: { maxTicksLimit: 6 } }, y: { title: { text: 'kt', display: true } } },
                    plugins: { legend: { position: 'bottom' } }, animation: { duration: 120 }
                };

                // Direction (0–360°)
                const dirData = {
                    labels: ts,
                    datasets: [
                        { label: 'Direction (°)', data: wdir, borderWidth: 1, pointRadius: 0, tension: 0.25 }
                    ]
                };
                const dirOpts = {
                    responsive: true, maintainAspectRatio: false, parsing: false,
                    scales: {
                        x: { type: 'time', ticks: { maxTicksLimit: 6 } },
                        y: { min: 0, max: 360, ticks: { stepSize: 90 }, title: { text: '°', display: true } }
                    },
                    plugins: { legend: { display: false } }, animation: { duration: 120 }
                };

                if (!containerEl.__tsState.speedChart) {
                    containerEl.__tsState.speedChart = new Chart(speedCtx, { type: 'line', data: speedData, options: speedOpts });
                } else {
                    const c = containerEl.__tsState.speedChart; c.data = speedData; c.update();
                }
                if (!containerEl.__tsState.dirChart) {
                    containerEl.__tsState.dirChart = new Chart(dirCtx, { type: 'line', data: dirData, options: dirOpts });
                } else {
                    const c2 = containerEl.__tsState.dirChart; c2.data = dirData; c2.update();
                }
            }

            async function load(hours) {
                const state = containerEl.__tsState;
                const seq = ++state.req;

                if (state.abort) { try { state.abort.abort(); } catch { } }
                state.abort = new AbortController();

                setDisabled(true);
                statusEl.textContent = 'Loading…';
                const rows = await fetchObsSeriesByCode(stationCode, hours, state.abort.signal);
                if (seq !== state.req) return;

                if (!rows.length) {
                    statusEl.textContent = 'No data';
                    state.speedChart?.destroy(); state.speedChart = null;
                    state.dirChart?.destroy(); state.dirChart = null;
                    setDisabled(false); return;
                }

                const ts = rows.map(r => r.ts);
                const wspd = rows.map(r => r.wspd);
                const gust = rows.map(r => r.gust);
                const wdir = rows.map(r => r.wdir); // keep 0–360 for bottom chart

                await new Promise(r => setTimeout(r, 60)); // let popup finish anim
                upsertCharts(ts, wspd, gust, wdir);

                if (leafletPopup?.update) {
                    leafletPopup.update();
                    setTimeout(() => {
                        leafletPopup.update();
                        containerEl.__tsState.speedChart?.resize();
                        containerEl.__tsState.dirChart?.resize();
                    }, 80);
                }

                statusEl.textContent = `${rows.length} pts`;
                setDisabled(false);
            }

            sel.addEventListener('change', () => load(parseInt(sel.value, 10)));
            sel.value = String(defaultHours);
            load(defaultHours);
        }
        // expose globally for the map code (already using it)
        window.attachTimeseriesTo = attachTimeseriesTo;
    </script>
</body>

</html>
