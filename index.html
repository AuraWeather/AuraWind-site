<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>AuraWind</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .leaflet-popup-content {
            margin: 4px 4px;
        }

        .ts-btn.ts-on {
            background: #333;
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        console.log("AuraWind index loaded");

        // --- init map ---
        const map = L.map('map').setView([50.8, -1.3], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- helpers ---
        function windowISO(hours, ref = new Date()) {
            const end = new Date(ref);
            const start = new Date(end.getTime() - hours * 3600 * 1000);
            return { startISO: start.toISOString(), endISO: end.toISOString() };
        }

        function unwrapDegrees(series) {
            if (!series || !series.length) return series;
            const out = []; let acc;
            for (const v of series) {
                if (v == null || isNaN(v)) { out.push(null); continue; }
                if (acc === undefined) { acc = v; out.push(acc); continue; }
                let dv = v - (acc % 360);
                if (dv > 180) dv -= 360;
                if (dv < -180) dv += 360;
                acc += dv; out.push(acc);
            }
            return out;
        }

        // --- supabase fetchers ---
        async function getStationIdByCode(stationCode) {
            const { data, error } = await supabase
                .from('stations')
                .select('id')
                .eq('code', stationCode)
                .limit(1)
                .maybeSingle();
            if (error) { console.error('[stations lookup]', error); return null; }
            return data?.id || null;
        }

        async function fetchObsSeriesByCode(stationCode, hours) {
            const stationId = await getStationIdByCode(stationCode);
            if (!stationId) { console.warn('No station UUID for code', stationCode); return []; }
            const { startISO, endISO } = windowISO(hours);
            const { data, error } = await supabase
                .from('observations')
                .select('observed_at, wind_speed, wind_gust, wind_direction')
                .eq('station_id', stationId)
                .gte('observed_at', startISO)
                .lte('observed_at', endISO)
                .order('observed_at', { ascending: true });
            if (error) { console.error('[observations select]', error); return []; }
            return (data || []).map(r => ({
                ts: r.observed_at,
                wspd: r.wind_speed,
                gust: r.wind_gust,
                wdir: r.wind_direction
            }));
        }

        // --- attach chart into popup ---
        async function attachTimeseriesTo(containerEl, stationCode, defaultHours = 6) {
            containerEl.innerHTML = `
        <div style="width:360px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:12px;opacity:.7;">Window:</span>
            <select class="ts-window" style="font-size:12px;padding:2px 4px;">
              <option value="3">3h</option>
              <option value="6" selected>6h</option>
              <option value="24">24h</option>
            </select>
            <span class="ts-ref" style="margin-left:auto;font-size:11px;opacity:.65;">server now()</span>
          </div>
          <div class="ts-chart" style="width:100%;height:240px;"></div>
          <div class="ts-status" style="font-size:12px;opacity:.75;margin-top:6px;"></div>
        </div>
      `;

            const sel = containerEl.querySelector('.ts-window');
            const chartEl = containerEl.querySelector('.ts-chart');
            const statusEl = containerEl.querySelector('.ts-status');

            async function load(hours) {
                statusEl.textContent = 'Loading…';
                const rows = await fetchObsSeriesByCode(stationCode, hours);
                if (!rows.length) {
                    Plotly.purge(chartEl);
                    statusEl.textContent = 'No data for this window';
                    return;
                }
                const ts = rows.map(r => r.ts);
                const wspd = rows.map(r => r.wspd);
                const gust = rows.map(r => r.gust);
                const wdir = unwrapDegrees(rows.map(r => r.wdir));

                Plotly.newPlot(chartEl, [
                    { x: ts, y: wspd, name: 'Wind', mode: 'lines' },
                    { x: ts, y: gust, name: 'Gust', mode: 'lines' },
                    { x: ts, y: wdir, name: 'Dir (unwrap)', mode: 'lines', yaxis: 'y2' },
                ], {
                    margin: { l: 48, r: 48, t: 8, b: 28 },
                    xaxis: { title: '' },
                    yaxis: { title: 'Speed' },
                    yaxis2: { title: 'Deg', overlaying: 'y', side: 'right' },
                    legend: { orientation: 'h' },
                    height: 240
                }, { displayModeBar: false, responsive: true });

                statusEl.textContent = `${rows.length} pts`;
            }

            sel.addEventListener('change', () => load(parseInt(sel.value, 10)));
            sel.value = String(defaultHours);
            load(defaultHours);
        }

        // --- markers demo (replace with your station loop) ---
        const stations = [
            { code: 'WL_STONE_POINT', lat: 50.8, lon: -1.3, wspd_kn: 27, wdir_degT: 229 }
        ];

        stations.forEach(st => {
            const marker = L.marker([st.lat, st.lon]).addTo(map);
            const popupHTML = `
        <div style="width:260px;padding:6px;">
          <b>${st.code}</b><br>
          ${st.wspd_kn} kt<br>${st.wdir_degT}°
          <div id="ts-pane-${st.code}" style="margin-top:8px;"></div>
        </div>`;
            marker.bindPopup(popupHTML);
            marker.on('popupopen', () => {
                setTimeout(() => {
                    const node = document.getElementById(`ts-pane-${st.code}`);
                    if (node) attachTimeseriesTo(node, st.code, 24);
                }, 100);
            });
        });

        // --- supabase init (use your real URL + key) ---
        const SUPABASE_URL = "https://bfcavqulacjbwogbjxhm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmY2F2cXVsYWNqYndvZ2JqeGhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Nzc3NzUsImV4cCI6MjA3MjA1Mzc3NX0.XCraHYMFzgnLfeHl1RUjDjnkDm6tYpzgtOQTMNVbr6c";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("[TS] Supabase URL:", SUPABASE_URL);
    </script>
</body>

</html>
